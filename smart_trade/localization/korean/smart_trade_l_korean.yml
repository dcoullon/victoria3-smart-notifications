 ST_NO_SHIPPING:0 "운송 없음"
 SMART_TRADE_OVERLAND_TT:0 "두 시장이 맞닿아 있습니다. 상품 양도는 육로로 이뤄지며 운송비가 없습니다."
 SMART_TRADE_MAX_SEND_TT:0 "수량을 [Max_CFixedPoint('(CFixedPoint)10', Min_CFixedPoint(Max_CFixedPoint('(CFixedPoint)10', Add_CFixedPoint(Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketBuyOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketSellOrders), '(CFixedPoint)10')), Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketSellOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketBuyOrders)))|0](으)로 설정합니다. 당신의 잉여를 넘지 않고 [ArticleDraft.GetSecondOrTarget.GetNameNoFormatting]의 품귀를 채웁니다."
 SMART_TRADE_ACCEPT_SEND_TT:0 "수용도가 가장 높은 수량으로 설정합니다. 이익은 최대, 손실은 최소로."
 SMART_TRADE_MAX_RECV_TT:0 "수량을 [Max_CFixedPoint('(CFixedPoint)10', Min_CFixedPoint(Max_CFixedPoint('(CFixedPoint)10', Add_CFixedPoint(Multiply_CFixedPoint('(CFixedPoint)0.3', Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketSellOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketBuyOrders)), '(CFixedPoint)10')), Add_CFixedPoint(Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketBuyOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketSellOrders), '(CFixedPoint)10')))|0](으)로 설정합니다. [ArticleDraft.GetFirstOrSource.GetNameNoFormatting]이(가) 내줄 수 있는 양을 넘지 않고 당신의 품귀를 채웁니다."
 SMART_TRADE_ACCEPT_RECV_TT:0 "수용도가 가장 높도록 수량을 [Max_CFixedPoint('(CFixedPoint)10', Add_CFixedPoint(Multiply_CFixedPoint('(CFixedPoint)0.3', Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketSellOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketBuyOrders)), '(CFixedPoint)10'))|0](으)로 설정합니다."
 SMART_TRADE_TREATIES_TT:0 "#header 조약 순수입#!\n보내는 상품: @money![Subtract_CFixedPoint(Subtract_CFixedPoint(GetPlayer.PredictTreatyIncome, GetPlayer.PredictTreatyExpenses), GetPlayer.MakeScope.ScriptValue('st_player_treaty_money'))|D+=]\n항로 비용: @money![Negate_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('st_player_lane_units'), GetGoods('merchant_marine').WithMarketContext(GetPlayer.GetMarket.Self).GetMarketPrice))|D+=] (추정)\n자금 양도: @money![GetPlayer.MakeScope.ScriptValue('st_player_treaty_money')|D+=]\n운송비는 자국 시장 가격의 상선으로 지불합니다. 항구가 많을수록 싸집니다.\n자세한 내용은 아웃라이너의 조약 목록을 보세요."
 st_treaty_article_losing_group:0 "(ST) 손실 중인 상품 양도"
 notification_st_treaty_article_losing_name:0 "[SCOPE.sC('st_tna_partner').GetNameNoFormatting]에 보내는 [SCOPE.sGoods('st_tna_goods').GetName]이(가) 손실 중입니다"
 notification_st_treaty_article_losing_desc:0 "[SCOPE.sC('st_tna_partner').GetNameNoFormatting]에 [SCOPE.sGoods('st_tna_goods').GetName]을(를) 보내는 양도가 6개월 연속 손실 중입니다: 현재 주당 약 @money![SCOPE.GetValue('st_tna_loss')|0]. 조약을 재협상해 이 상품을 빼거나 조약을 취소하세요."
 notification_st_treaty_article_losing_tooltip:0 "#header $notification_st_treaty_article_losing_name$#!\n$TOOLTIP_DELIMITER$\n$notification_st_treaty_article_losing_desc$"
 ST_REC_HEADER:0 "(ST) 추천 상품 양도"
 ST_REC_HEADER_TT:0 "지금 제안할 수 있는 가장 수익성 높은 상품 양도 5건, 매달 재계산: 첫 주 가격으로 추정한 주간 이익, 상대가 완전히 수락하는 최적 수량 기준.\n이익이 나는 양도, 시장에 10 이상 잉여가 있는 상품, 전쟁 중이 아닌 상대만 표시합니다.\n괄호 안: 조항을 넣기 전 상대의 기본 수락도(마우스를 올리면 상세). 수치가 확인되면(첫 달부터) 0 미만인 상대는 제외됩니다."
 ST_REC_REFRESH_TT:0 "지금 추천을 다시 계산합니다."
 ST_REC_NONE:0 "현재 이익이 나는 상품 양도가 없습니다."
 ST_REC_PENDING:0 "달이 바뀔 때 계산됩니다. 지금 계산하려면 새로 고침 버튼을 누르세요."
 ST_REC_TREATY_TT:0 "이 국가와 조약을 엽니다."
 ST_REC_ACC_TT:0 "#header 기본 수락도: [Country.GetNameNoFormatting]#!\n[Country.MakeScope.GetScriptValueDesc('st_rec_acc')]"
 ST_REC_ONE_HEADER:0 "(ST) 이 상품의 최적 상대"
 ST_REC_ONE_HEADER_TT:0 "상품 양도로 이 상품을 보내기에 가장 수익성 높은 3개국, 이 패널을 열 때 계산: 첫 주 가격으로 추정한 주간 이익, 상대가 완전히 수락하는 최적 수량 기준. 괄호 안: 조항을 넣기 전 상대의 기본 수락도(마우스를 올리면 상세). 0 미만인 상대는 제외됩니다."
 ST_REC_ONE_PENDING:0 "상대를 찾는 중..."
 ST_REC_ONE_NONE:0 "현재 이 상품에 값을 치를 상대가 없습니다. 상품 양도에는 시장에 10 이상의 잉여가 필요합니다."
