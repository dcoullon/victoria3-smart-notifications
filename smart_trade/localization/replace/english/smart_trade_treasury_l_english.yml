l_english:
 # Smart Trade: "Net treaty income" in the top-bar treasury tooltip. That
 # tooltip is assembled by engine code from these entries, so the line is
 # appended to existing ones. EXPLORATION RUN 3 tries two entries, marked
 # (A) and (B), to learn which always shows and whether nested arithmetic
 # renders in loc. Each keeps vanilla's text verbatim first; baselines in
 # tools/check_references.py REPLACED_LOC_BASELINE catch a patch changing it.
 TEMPORARY_EXPENSES_BREAKDOWN:0 "#bold Temporary National Expenses:#! #tooltippable #tooltip:[GetPlayer.GetTooltipTag],TOTAL_EXPENSES_BREAKDOWN,TotalExpensesTooltip #bold #N @money!-[GetPlayer.GetWeeklyTemporaryExpenses|D-]#!#!#!#!\n#bold Net treaty income (A), already counted above:#! #tooltippable #tooltip:[GetPlayer.GetTooltipTag],SMART_TRADE_TREATIES_TT,SmartTradeTreatiesTooltip @money![GetPlayer.MakeScope.ScriptValue('st_player_treaty_net_est')|D+=]#!#!"
 BALANCE_WITHOUT_TEMPORARY_INCOME_AND_EXPENSES:0 "\nBalance (excluding Temporary Income and Expenses): #v @money![GetPlayer.PredictBalanceWithoutTemporaryIncomeAndExpenses|D+=]#!\n#bold Net treaty income (B), already counted above:#! #tooltippable #tooltip:[GetPlayer.GetTooltipTag],SMART_TRADE_TREATIES_TT,SmartTradeTreatiesTooltip @money![Subtract_CFixedPoint(Subtract_CFixedPoint(GetPlayer.PredictTreatyIncome, GetPlayer.PredictTreatyExpenses), Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('st_player_lane_units'), GetGoods('merchant_marine').WithMarketContext(GetPlayer.GetMarket.Self).GetMarketPrice))|D+=]#!#!"
