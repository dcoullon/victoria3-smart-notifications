 SMART_TRADE_BEST_TT:0 "Set the quantity to [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('st_bh', MakeScopeValue(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketBuyOrders)).AddScope('st_sh', MakeScopeValue(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketSellOrders)).AddScope('st_bp', MakeScopeValue(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketBuyOrders)).AddScope('st_sp', MakeScopeValue(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketSellOrders)).AddScope('st_ph', MakeScopeValue(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketPrice)).AddScope('st_pp', MakeScopeValue(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketPrice)).AddScope('st_base', MakeScopeValue(ArticleDraft.GetGoods.GetBasePrice)).AddScope('st_ship', MakeScopeValue(Select_CFixedPoint(GetScriptedGui('st_markets_adjacent_sgui').IsValid(GuiScope.SetRoot(ArticleDraft.GetFirstOrSource.MakeScope).AddScope('st_other', ArticleDraft.GetSecondOrTarget.MakeScope).End), '(CFixedPoint)0', Multiply_CFixedPoint(Divide_CFixedPoint(GetGoods('merchant_marine').WithMarketContext(GetPlayer.GetMarket.Self).GetMarketPrice, ArticleDraft.GetGoods.GetTradedQuantity), '(CFixedPoint)1.25')))).AddScope('st_cap', MakeScopeValue(Max_CFixedPoint('(CFixedPoint)10', Add_CFixedPoint(Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketBuyOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketSellOrders), '(CFixedPoint)10')))).ScriptValue('st_q_best')|0]: the best weekly result that [ArticleDraft.GetSecondOrTarget.GetNameNoFormatting] still wants."
 SMART_TRADE_MAX_SEND_TT:0 "Set the quantity to [Max_CFixedPoint('(CFixedPoint)10', Min_CFixedPoint(Max_CFixedPoint('(CFixedPoint)10', Add_CFixedPoint(Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketBuyOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketSellOrders), '(CFixedPoint)10')), Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketSellOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketBuyOrders)))|0]: the most you can spare that [ArticleDraft.GetSecondOrTarget.GetNameNoFormatting] still fully values (the lower of your surplus and its shortage plus 10)."
 SMART_TRADE_ACCEPT_SEND_TT:0 "Set the quantity to [Max_CFixedPoint('(CFixedPoint)10', Add_CFixedPoint(Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketBuyOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketSellOrders), '(CFixedPoint)10'))|0]: [ArticleDraft.GetSecondOrTarget.GetNameNoFormatting]'s shortage plus 10, where it likes this good most. Each unit above costs 0.3 acceptance."
