 SMART_TRADE_TREATIES_TT:0 "#header Net treaty income, per week#!\nGoods you send, sale minus purchase: @money![Subtract_CFixedPoint(Subtract_CFixedPoint(GetPlayer.PredictTreatyIncome, GetPlayer.PredictTreatyExpenses), GetPlayer.MakeScope.ScriptValue('st_player_treaty_money'))|D+=]\nShipping lanes for them: @money![Negate_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('st_player_lane_units'), GetGoods('merchant_marine').WithMarketContext(GetPlayer.GetMarket.Self).GetMarketPrice))|D+=] (estimated at the short-route rate)\nMoney transfers: @money![GetPlayer.MakeScope.ScriptValue('st_player_treaty_money')|D+=]\n\nPer treaty: the Treaties list in the outliner."
