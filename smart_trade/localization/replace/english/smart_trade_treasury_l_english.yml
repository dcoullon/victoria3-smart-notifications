 SMART_TRADE_ACCEPT_RECV_TT:0 "Set the quantity to [Max_CFixedPoint('(CFixedPoint)10', Add_CFixedPoint(Multiply_CFixedPoint('(CFixedPoint)0.3', Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketSellOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketBuyOrders)), '(CFixedPoint)10'))|0]: 30% of [ArticleDraft.GetFirstOrSource.GetNameNoFormatting]'s surplus plus 10, the most it sends without liking the deal less."
