 ST_REC_HEADER:0 "(ST) Transferts de marchandises suggérés"
 ST_REC_HEADER_TT:0 "Les 5 transferts de marchandises les plus rentables que vous pourriez proposer, recalculés chaque mois : profit hebdomadaire estimé aux prix de la première semaine, à la meilleure quantité que le partenaire accepte pleinement.\nSeulement les transferts rentables, les biens dont votre marché a au moins 10 en surplus et les partenaires avec qui vous n'êtes pas en guerre.\nEntre parenthèses : l'acceptation de base du partenaire avant tout article (survolez pour le détail). Les partenaires sous 0 sont exclus une fois leur chiffre connu, dès leur premier mois."
 ST_REC_REFRESH_TT:0 "Recalculer les suggestions maintenant."
