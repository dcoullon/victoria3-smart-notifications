 SMART_TRADE_TREATIES_TT:0 "#header Revenu net des traités#!\nBiens envoyés : @money![Subtract_CFixedPoint(Subtract_CFixedPoint(GetPlayer.PredictTreatyIncome, GetPlayer.PredictTreatyExpenses), GetPlayer.MakeScope.ScriptValue('st_player_treaty_money'))|D+=]\nCoût des voies de navigation : @money![Negate_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('st_player_lane_units'), GetGoods('merchant_marine').WithMarketContext(GetPlayer.GetMarket.Self).GetMarketPrice))|D+=] (estimation)\nTransferts d'argent : @money![GetPlayer.MakeScope.ScriptValue('st_player_treaty_money')|D+=]\nLe transport se paie en marine marchande au prix de votre marché ; plus de ports le font baisser.\nDétails dans la liste des traités du tableau de bord."
