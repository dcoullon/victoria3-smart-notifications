 ST_REC_HEADER:0 "(ST) Предлагаемые передачи товаров"
 ST_REC_HEADER_TT:0 "5 самых выгодных передач товаров, которые можно предложить сейчас, пересчитываются каждый месяц: недельная прибыль по ценам первой недели при лучшем объёме, который партнёр полностью принимает.\nТолько прибыльные передачи, товары, которых на вашем рынке в избытке не меньше 10, и партнёры, с которыми вы не воюете.\nВ скобках: базовое одобрение партнёра до любых статей (наведите для подробностей). Партнёры ниже 0 исключаются, когда их значение известно, с их первого месяца."
 ST_REC_REFRESH_TT:0 "Пересчитать предложения сейчас."
 ST_REC_NONE:0 "Сейчас ни одна передача товаров не принесла бы прибыли."
 ST_REC_PENDING:0 "Рассчитывается в начале месяца. Нажмите кнопку обновления, чтобы рассчитать сейчас."
 ST_REC_TREATY_TT:0 "Открыть договор с этой страной."
 ST_REC_ACC_TT:0 "#header Базовое одобрение: [Country.GetNameNoFormatting]#!\n[Country.MakeScope.GetScriptValueDesc('st_rec_acc')]"
