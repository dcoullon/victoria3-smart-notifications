 notification_st_treaty_article_losing_desc:0 "Передача товара [SCOPE.sGoods('st_tna_goods').GetName] (получатель: [SCOPE.sC('st_tna_partner').GetNameNoFormatting]) убыточна 6 месяцев подряд: сейчас около @money![SCOPE.GetValue('st_tna_loss')|0] в неделю. Пересмотрите договор, чтобы убрать этот товар, или расторгните его."
