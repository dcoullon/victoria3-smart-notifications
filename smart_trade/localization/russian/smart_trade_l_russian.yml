 ST_REC_ONE_HEADER_TT:0 "3 самые выгодные страны для передачи этого товара, рассчитываются при открытии этой панели: недельная прибыль по ценам первой недели при лучшем объёме, который партнёр полностью принимает. В скобках: базовое одобрение партнёра до любых статей (наведите для подробностей); партнёры ниже 0 исключаются."
 ST_REC_ONE_PENDING:0 "Поиск партнёров..."
 ST_REC_ONE_NONE:0 "Сейчас ни один партнёр не заплатил бы за этот товар. Для передачи товаров нужно не меньше 10 в избытке на вашем рынке."
