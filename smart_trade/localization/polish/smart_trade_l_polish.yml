 SMART_TRADE_TREATIES_TT:0 "#header Dochód netto z traktatów#!\nWysyłane towary: @money![Subtract_CFixedPoint(Subtract_CFixedPoint(GetPlayer.PredictTreatyIncome, GetPlayer.PredictTreatyExpenses), GetPlayer.MakeScope.ScriptValue('st_player_treaty_money'))|D+=]\nKoszt szlaków żeglugowych: @money![Negate_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('st_player_lane_units'), GetGoods('merchant_marine').WithMarketContext(GetPlayer.GetMarket.Self).GetMarketPrice))|D+=] (szacunek)\nPrzekazy pieniężne: @money![GetPlayer.MakeScope.ScriptValue('st_player_treaty_money')|D+=]\nTransport opłaca się marynarką handlową po cenie twojego rynku; więcej portów ją obniża.\nSzczegóły na liście traktatów w Przyborniku."
 st_treaty_article_losing_group:0 "(ST) Transfer towarów przynosi straty"
 notification_st_treaty_article_losing_name:0 "[SCOPE.sGoods('st_tna_goods').GetName], odbiorca: [SCOPE.sC('st_tna_partner').GetNameNoFormatting], przynosi straty"
 notification_st_treaty_article_losing_desc:0 "Wysyłanie towaru [SCOPE.sGoods('st_tna_goods').GetName] (odbiorca: [SCOPE.sC('st_tna_partner').GetNameNoFormatting]) przynosi straty od 6 miesięcy z rzędu: obecnie ok. @money![SCOPE.GetValue('st_tna_loss')|0] na tydzień (szacunek; przegląd pokazuje dokładną kwotę traktatu). Renegocjuj traktat, aby usunąć ten towar, albo go zerwij."
 notification_st_treaty_article_losing_tooltip:0 "#header $notification_st_treaty_article_losing_name$#!\n$TOOLTIP_DELIMITER$\n$notification_st_treaty_article_losing_desc$"
 ST_REC_HEADER:0 "(ST) Sugerowane transfery towarów"
 ST_REC_HEADER_TT:0 "5 najbardziej opłacalnych transferów towarów, które możesz teraz zaproponować, przeliczanych co miesiąc: tygodniowy zysk szacowany po cenach z pierwszego tygodnia, przy najlepszej ilości, którą partner w pełni akceptuje.\nTylko opłacalne transfery, towary, których twój rynek ma co najmniej 10 nadwyżki, i partnerzy, z którymi nie prowadzisz wojny.\nW nawiasie: bazowa akceptacja partnera przed jakimkolwiek artykułem (najedź, by zobaczyć szczegóły). Partnerzy poniżej 0 są pomijani, gdy ich wartość jest znana, od ich pierwszego miesiąca."
 ST_REC_REFRESH_TT:0 "Przelicz sugestie teraz."
 ST_REC_NONE:0 "Obecnie żaden transfer towarów nie byłby opłacalny."
 ST_REC_PENDING:0 "Obliczane na początku miesiąca. Naciśnij przycisk odświeżania, aby obliczyć teraz."
 ST_REC_TREATY_TT:0 "Otwórz traktat z tym krajem."
 ST_REC_ACC_TT:0 "#header Akceptacja bazowa: [Country.GetNameNoFormatting]#!\n[Country.MakeScope.GetScriptValueDesc('st_rec_acc')]"
 ST_REC_ONE_HEADER:0 "(ST) Najlepsi partnerzy dla tego towaru"
 ST_REC_ONE_HEADER_TT:0 "3 najbardziej opłacalne kraje, do których można wysłać ten towar transferem towarów, obliczane przy otwarciu tego panelu: tygodniowy zysk po cenach z pierwszego tygodnia, przy najlepszej ilości, którą partner w pełni akceptuje. W nawiasie: bazowa akceptacja partnera przed jakimkolwiek artykułem (najedź, by zobaczyć szczegóły); partnerzy poniżej 0 są pomijani."
 ST_REC_ONE_PENDING:0 "Szukanie partnerów..."
 ST_REC_ONE_NONE:0 "Obecnie żaden partner nie zapłaciłby za ten towar. Transfer towarów wymaga co najmniej 10 nadwyżki na twoim rynku."
