 SMART_TRADE_MAX_SEND_TT:0 "Ustawia ilość na [Max_CFixedPoint('(CFixedPoint)10', Min_CFixedPoint(Max_CFixedPoint('(CFixedPoint)10', Add_CFixedPoint(Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketBuyOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketSellOrders), '(CFixedPoint)10')), Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketSellOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketBuyOrders)))|0]: pokrywa niedobór u odbiorcy ([ArticleDraft.GetSecondOrTarget.GetNameNoFormatting]) bez przekraczania twojej nadwyżki."
