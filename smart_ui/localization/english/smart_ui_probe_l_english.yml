l_english:
 # =====================================================================
 # THROWAWAY PROBE FILE -- delete before anything ships.
 #
 # Purpose: answer, in ONE playthrough, the mechanics questions that decide
 # whether the event-tooltip feature is buildable at all. See
 # docs/followup-plan-2026-09-11.md section "Item 2b".
 #
 # Every probe prints a STATIC marker next to its dynamic value, because a
 # blank result must be distinguishable from "the override never applied".
 # A marker with nothing after it = the function failed. No marker at all =
 # the override lost to vanilla. (Same discipline as the notification
 # logger: verify the instrument before trusting what it says.)
 #
 # NEVER use literal square brackets as decoration in loc -- they are parsed
 # as dynamic text and there is no escape. All markers below use parentheses.
 #
 # Vanilla originals live in:
 #   <game>/localization/english/effects_l_english.yml:577-593  (pop effects)
 #   <game>/localization/english/effects_l_english.yml:427-431  (add_modifier)
 # Version suffixes (:3 etc.) deliberately match vanilla's.
 # =====================================================================

 # ---------------------------------------------------------------------
 # T1 -- Does a mod override of an engine effect template win over vanilla?
 # Country-scoped radicals. Look for "(T1)" at the start of the line.
 # Also tests: COUNTRY scope bound, strata accessors, loc-side arithmetic.
 # ---------------------------------------------------------------------
 ADD_RADICALS_THIRD:3 "(T1) $VALUE|-=1%$ of $FILTER_DESC$ in [COUNTRY.GetName] become more [concept_radical]$SNUI_T1_COUNTRY_PROBE$"

 SNUI_T1_COUNTRY_PROBE:0 "\n$TAB$(T1a total=[COUNTRY.GetTotalPopulation|K]) (T1b lower=[GetTrendValue(COUNTRY.GetLowerStrataPopulationTrend)|K]) (T1c middle=[GetTrendValue(COUNTRY.GetMiddleStrataPopulationTrend)|K]) (T1d upper=[GetTrendValue(COUNTRY.GetUpperStrataPopulationTrend)|K]) (T1e strata_param=$STRATA$)"

 # ---------------------------------------------------------------------
 # T2 -- Are the FILTER objects live scopes here, and is $VALUE$ reachable
 # inside POP_EFFECT_FILTER? Vanilla body is preserved verbatim, probes
 # appended. If a group's marker appears, that scope is bound and usable.
 # ---------------------------------------------------------------------
 POP_EFFECT_FILTER:0 "[AddLocalizationIf(InterestGroup.IsValid, 'POP_EFFECT_FILTER_INTEREST_GROUP')][AddLocalizationIf(Culture.IsValid, 'POP_EFFECT_FILTER_CULTURE')][AddLocalizationIf(Religion.IsValid, 'POP_EFFECT_FILTER_RELIGION')][AddLocalizationIf(PopType.IsValid, 'POP_EFFECT_FILTER_POP_TYPE')][AddTextIf(Not(EqualTo_string('none', '$STRATA$')), Concatenate(Localize('$STRATA$'), ' '))][Concept('concept_pop', '$concept_pops$')][AddLocalizationIf(PopType.IsValid, 'SNUI_T2_POPTYPE')][AddLocalizationIf(InterestGroup.IsValid, 'SNUI_T2_IG')][AddLocalizationIf(Culture.IsValid, 'SNUI_T2_CULTURE')][AddLocalizationIf(Religion.IsValid, 'SNUI_T2_RELIGION')]"

 SNUI_T2_POPTYPE:0 " (T2a poptype=[PopType.GetPopulation(GetPlayer)|K])"
 SNUI_T2_IG:0 " (T2b ig=[InterestGroup.GetPopulation|K] approval=[InterestGroup.GetApprovalValue] clout=[InterestGroup.GetClout|%1])"
 SNUI_T2_CULTURE:0 " (T2c culture=[Culture.GetPopulation|K])"
 SNUI_T2_RELIGION:0 " (T2d religion=[Religion.GetPopulation|K])"

 # ---------------------------------------------------------------------
 # T3 -- State scope. Does STATE bind, and can STATE.Self be passed as a
 # FUNCTION ARGUMENT? That last one has no vanilla precedent and gates the
 # whole state-scoped half of the feature (41% of all pop effects).
 # T3b failing while T3a works = arg-passing is the problem, not the scope.
 # ---------------------------------------------------------------------
 ADD_RADICALS_IN_STATE_THIRD:0 "(T3) $VALUE|-=1%$ of $FILTER_DESC$ in [STATE.GetName] become more [concept_radical]$SNUI_T3_STATE_PROBE$"

 SNUI_T3_STATE_PROBE:0 "\n$TAB$(T3a statepop=[STATE.GetPopulationSize|K])[AddLocalizationIf(PopType.IsValid, 'SNUI_T3_POPTYPE_IN_STATE')][AddLocalizationIf(Culture.IsValid, 'SNUI_T3_CULTURE_IN_STATE')]"

 SNUI_T3_POPTYPE_IN_STATE:0 " (T3b poptype_in_state=[PopType.GetStatePopulation(STATE.Self)|K])"
 SNUI_T3_CULTURE_IN_STATE:0 " (T3c culture_in_state=[STATE.GetPopulationForCulture(Culture.Self)|K])"

 # ---------------------------------------------------------------------
 # T4 -- Loc-side arithmetic, so "5% of 12.4M" can become "about 620k".
 # Vanilla precedent for Multiply_CFixedPoint exists (interfaces:4765) but
 # not with $VALUE$ as an operand, which is the part in doubt.
 # ---------------------------------------------------------------------
 # NOTE the :4 suffix -- vanilla ships ADD_LOYALISTS_THIRD:3, and T1's
 # ADD_RADICALS_THIRD matches vanilla's :3 exactly. Comparing the two answers
 # whether precedence is decided by load order or by the version number:
 #   both markers appear -> load order wins, the number is cosmetic
 #   only T4 appears     -> the number decides, and overrides must out-number vanilla
 #   neither appears     -> mod loc cannot override engine templates at all
 ADD_LOYALISTS_THIRD:4 "(T4) $VALUE|+=1%$ of $FILTER_DESC$ in [COUNTRY.GetName] become more [concept_loyalist]\n$TAB$(T4a raw_value=$VALUE$) (T4b product=[Multiply_CFixedPoint('$VALUE$', COUNTRY.GetTotalPopulation)|K])"

 # ---------------------------------------------------------------------
 # T5 -- Interest group context on modifier lines, the "-2 Interest Group
 # Approval, but -2 from WHAT?" problem. ADD_MODIFIER_THIRD is shared by
 # every subject type (country, state, IG, character, building), so the
 # InterestGroup.IsValid guard is what keeps it safe -- if the guard works,
 # the marker appears ONLY on interest-group modifiers.
 # Large blast radius: this template renders for every add_modifier in the
 # game. Watch for breakage on non-IG modifiers.
 # ---------------------------------------------------------------------
 ADD_MODIFIER_THIRD:0 "$SUBJECT_NAME$ gets #tooltippable #tooltip:[GetRawTextTooltipTag('$ADD_MODIFIER_BREAKDOWN$')] $MODIFIER_NAME$#!#! $MAYBE_DECAYING_WITH_SPACE_AFTER$$DURATION$\n$TAB$#indent_newline:3 $MODIFIER_DESC$#![AddLocalizationIf(InterestGroup.IsValid, 'SNUI_T5_IG_CONTEXT')]"

 SNUI_T5_IG_CONTEXT:0 "\n$TAB$(T5 ig_approval_now=[InterestGroup.GetApprovalValue] clout=[InterestGroup.GetClout|%1] pop=[InterestGroup.GetPopulation|K])"
