 notification_smart_notifications_mod_updated_desc:0 "W tej wersji zmieniono priorytety powiadomień.\n\nKliknij #v Przywróć ustawienia domyślne#! w Ustawieniach wiadomości, aby je zastosować – do tego czasu twoje zapisane ustawienia zastępują ustawienia tego moda."
