l_korean:
 BC_LEVELS_LABEL:0 "(Build All) 단계:"
 BC_LEVELS_1:0 "1"
 BC_LEVELS_5:0 "5"
 BC_LEVELS_10:0 "10"
 BC_EFF_LABEL:0 "(Build All) 최소 건설 효율:"
 BC_EFF_VALUE:0 "[Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')]%"
 BC_EFF_TOOLTIP:0 "체크하면 Build All이 이 건물의 건설 효율이 이 기준값보다 낮은 주를 모두 건너뜁니다. 건설 효율은 아래 목록의 각 행에 표시된 백분율입니다."
 BC_TOOLTIP_EFF:0 "\n\n이 건물의 건설 효율이 [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')]% 미만인 주는 건너뜁니다."
 BC_TOOLTIP_CAP:0 "\n\n비활성화됨: 건설 대기열에 이미 관영 건설이 10,000개 이상 있습니다. 일부를 취소하거나 대기열이 줄어들 때까지 기다리세요."
 BC_BUILD_BUTTON_1:0 "(Build All) 최대 [GetDataModelSize(MapListPanel.AccessValidOptions)]개 주에 각 1단계 예약"
 BC_BUILD_BUTTON_5:0 "(Build All) 최대 [GetDataModelSize(MapListPanel.AccessValidOptions)]개 주에 각 5단계 예약"
 BC_BUILD_BUTTON_10:0 "(Build All) 최대 [GetDataModelSize(MapListPanel.AccessValidOptions)]개 주에 각 10단계 예약"
 BC_BUILD_TOOLTIP_1:0 "아래 표시된 모든 주에 이 건물을 1단계씩 건설 대기열에 추가합니다.\n\n게임이 건설을 허용하지 않는 주는 건너뛰므로, 실제로 추가되는 수는 [GetDataModelSize(MapListPanel.AccessValidOptions)]개보다 적을 수 있습니다.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "아래 표시된 모든 주에 이 건물을 5단계씩 건설 대기열에 추가합니다.\n\n게임이 건설을 허용하지 않는 주는 건너뛰므로, 실제로 추가되는 수는 [GetDataModelSize(MapListPanel.AccessValidOptions)]개보다 적을 수 있습니다.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "아래 표시된 모든 주에 이 건물을 10단계씩 건설 대기열에 추가합니다.\n\n게임이 건설을 허용하지 않는 주는 건너뛰므로, 실제로 추가되는 수는 [GetDataModelSize(MapListPanel.AccessValidOptions)]개보다 적을 수 있습니다.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
