l_german:
 BC_LEVELS_LABEL:0 "Stufen:"
 BC_LEVELS_1:0 "1"
 BC_LEVELS_5:0 "5"
 BC_LEVELS_10:0 "10"
 BC_SECTION_TITLE:0 "Build All"
 BC_SECTION_SUMMARY:0 "[SelectLocalization(GetVariableSystem.Exists('bc_eff_on'), 'BC_SUMMARY_EFF', 'BC_SUMMARY')]"
 BC_SUMMARY:0 "Stufen: [Select_CString(GetVariableSystem.Exists('bc_levels'), GetVariableSystem.Get('bc_levels'), '1')]"
 BC_SUMMARY_EFF:0 "Stufen: [Select_CString(GetVariableSystem.Exists('bc_levels'), GetVariableSystem.Get('bc_levels'), '1')], min. [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '70')] %"
 BC_EFF_LABEL:0 "Min. Baueffizienz:"
 BC_EFF_VALUE:0 "[Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '70')] %"
 BC_EFF_TOOLTIP:0 "Wenn aktiviert, überspringt Build All jeden Staat, in dem die Baueffizienz dieses Gebäudes unter diesem Schwellenwert liegt. 70 % bedeutet höchstens 30 % Abzug: Das Spiel zeigt das als -30 % Baueffizienz an."
 BC_TOOLTIP_EFF:0 "\n\nStaaten unter [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '70')] % Baueffizienz für dieses Gebäude werden übersprungen."
 BC_TOOLTIP_CAP:0 "\n\nDeaktiviert: Ihre Baureihe enthält bereits 10.000 oder mehr Staatsbauten. Brechen Sie einige ab oder warten Sie, bis die Baureihe kürzer wird."
 BC_BUILD_BUTTON_1:0 "1 Stufe in max. [GetDataModelSize(MapListPanel.AccessValidOptions)] Staaten einreihen"
 BC_BUILD_BUTTON_5:0 "5 Stufen in max. [GetDataModelSize(MapListPanel.AccessValidOptions)] Staaten einreihen"
 BC_BUILD_BUTTON_10:0 "10 Stufen in max. [GetDataModelSize(MapListPanel.AccessValidOptions)] Staaten einreihen"
 BC_BUILD_TOOLTIP_1:0 "Reiht 1 Stufe dieses Gebäudes in jedem unten aufgeführten Staat in die Baureihe ein.\n\nStaaten, in denen das Spiel Sie nicht bauen lässt, werden übersprungen – es können also weniger als [GetDataModelSize(MapListPanel.AccessValidOptions)] eingereiht werden.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "Reiht 5 Stufen dieses Gebäudes in jedem unten aufgeführten Staat in die Baureihe ein.\n\nStaaten, in denen das Spiel Sie nicht bauen lässt, werden übersprungen – es können also weniger als [GetDataModelSize(MapListPanel.AccessValidOptions)] eingereiht werden.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "Reiht 10 Stufen dieses Gebäudes in jedem unten aufgeführten Staat in die Baureihe ein.\n\nStaaten, in denen das Spiel Sie nicht bauen lässt, werden übersprungen – es können also weniger als [GetDataModelSize(MapListPanel.AccessValidOptions)] eingereiht werden.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
