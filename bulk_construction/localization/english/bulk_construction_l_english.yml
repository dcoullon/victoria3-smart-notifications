l_english:
 BC_LEVELS_LABEL:0 "(Build All) Levels:"
 BC_LEVELS_1:0 "1"
 BC_LEVELS_5:0 "5"
 BC_LEVELS_10:0 "10"
 BC_EFF_LABEL:0 "(Build All) Min. efficiency:"
 BC_EFF_VALUE:0 "[Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')]%"
 BC_EFF_TOOLTIP:0 "When ticked, Build All skips every state whose construction efficiency for this building is below this threshold. That efficiency is the percentage shown on each row of the list below."
 BC_TOOLTIP_EFF:0 "\n\nStates below [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')]% construction efficiency for this building are skipped."
 BC_TOOLTIP_CAP:0 "\n\nDisabled: your construction queue already holds 10,000 or more government constructions. Cancel some, or let the queue run down."
 BC_BUILD_BUTTON_1:0 "(Build All) Queue 1 level in up to [GetDataModelSize(MapListPanel.AccessValidOptions)] states"
 BC_BUILD_BUTTON_5:0 "(Build All) Queue 5 levels in up to [GetDataModelSize(MapListPanel.AccessValidOptions)] states"
 BC_BUILD_BUTTON_10:0 "(Build All) Queue 10 levels in up to [GetDataModelSize(MapListPanel.AccessValidOptions)] states"
 BC_BUILD_TOOLTIP_1:0 "Queue 1 level of this building in every state listed below.\n\nStates the game will not let you build in are skipped, so fewer than [GetDataModelSize(MapListPanel.AccessValidOptions)] may be queued.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "Queue 5 levels of this building in every state listed below.\n\nStates the game will not let you build in are skipped, so fewer than [GetDataModelSize(MapListPanel.AccessValidOptions)] may be queued.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "Queue 10 levels of this building in every state listed below.\n\nStates the game will not let you build in are skipped, so fewer than [GetDataModelSize(MapListPanel.AccessValidOptions)] may be queued.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
