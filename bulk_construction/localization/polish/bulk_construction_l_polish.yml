l_polish:
 BC_LEVELS_LABEL:0 "(Build All) Poziomy:"
 BC_LEVELS_1:0 "1"
 BC_LEVELS_5:0 "5"
 BC_LEVELS_10:0 "10"
 BC_EFF_LABEL:0 "(Build All) Min. wydajność:"
 BC_EFF_VALUE:0 "[Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')]%"
 BC_EFF_TOOLTIP:0 "Po zaznaczeniu Build All pomija każdy obszar, w którym wydajność budowy tego budynku jest niższa niż ten próg. Ta wydajność to wartość procentowa widoczna w każdym wierszu listy poniżej."
 BC_TOOLTIP_EFF:0 "\n\nObszary, w których wydajność budowy tego budynku jest niższa niż [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')]%, są pomijane."
 BC_TOOLTIP_CAP:0 "\n\nWyłączone: kolejka budowy zawiera już co najmniej 10 000 budów na zlecenie rządu. Anuluj część z nich lub poczekaj, aż kolejka się skróci."
 BC_BUILD_BUTTON_1:0 "(Build All) Dodaj 1 poziom w maks. [GetDataModelSize(MapListPanel.AccessValidOptions)] obszarach"
 BC_BUILD_BUTTON_5:0 "(Build All) Dodaj 5 poziomów w maks. [GetDataModelSize(MapListPanel.AccessValidOptions)] obszarach"
 BC_BUILD_BUTTON_10:0 "(Build All) Dodaj 10 poziomów w maks. [GetDataModelSize(MapListPanel.AccessValidOptions)] obszarach"
 BC_BUILD_TOOLTIP_1:0 "Dodaje 1 poziom tego budynku do kolejki budowy w każdym obszarze administracyjnym wymienionym poniżej.\n\nObszary, w których gra nie pozwala budować, są pomijane – może więc zostać dodanych mniej niż [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "Dodaje 5 poziomów tego budynku do kolejki budowy w każdym obszarze administracyjnym wymienionym poniżej.\n\nObszary, w których gra nie pozwala budować, są pomijane – może więc zostać dodanych mniej niż [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "Dodaje 10 poziomów tego budynku do kolejki budowy w każdym obszarze administracyjnym wymienionym poniżej.\n\nObszary, w których gra nie pozwala budować, są pomijane – może więc zostać dodanych mniej niż [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
