 BC_TOOLTIP_EFF:0 "\n\nTylko obszary z karą do wydajności budowy wynoszącą [Select_CString(GetVariableSystem.Exists('bc_pen'), GetVariableSystem.Get('bc_pen'), '30')]% lub mniej."
