 BC_BUILD_BUTTON_10:0 "Dodaj 10 poziomów w maks. [GetDataModelSize(MapListPanel.AccessValidOptions)] obszarach"
 BC_BUILD_TOOLTIP_1:0 "Dodaje 1 poziom tego budynku do kolejki budowy w każdym obszarze administracyjnym wymienionym poniżej.\n\nObszary, w których gra nie pozwala budować, są pomijane – może więc zostać dodanych mniej niż [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_pen_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "Dodaje 5 poziomów tego budynku do kolejki budowy w każdym obszarze administracyjnym wymienionym poniżej.\n\nObszary, w których gra nie pozwala budować, są pomijane – może więc zostać dodanych mniej niż [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_pen_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "Dodaje 10 poziomów tego budynku do kolejki budowy w każdym obszarze administracyjnym wymienionym poniżej.\n\nObszary, w których gra nie pozwala budować, są pomijane – może więc zostać dodanych mniej niż [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_pen_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
