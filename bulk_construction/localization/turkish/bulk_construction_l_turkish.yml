 BC_EFF_TOOLTIP:0 "İşaretliyse Build All, bu binanın inşaat verimliliğinin bu eşiğin altında olduğu her vilayeti atlar. %70, en fazla %30 ceza demektir: oyun bunu -%30 inşaat verimliliği olarak gösterir."
 BC_TOOLTIP_EFF:0 "\n\nBu bina için inşaat verimliliği %[Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '70')] altında olan vilayetler atlanır."
 BC_TOOLTIP_CAP:0 "\n\nDevre dışı: inşa sıranızda zaten 10.000 veya daha fazla devlete bağlı inşaat var. Bazılarını iptal edin ya da sıranın azalmasını bekleyin."
 BC_BUILD_BUTTON_1:0 "En fazla [GetDataModelSize(MapListPanel.AccessValidOptions)] vilayete 1 seviye ekle"
 BC_BUILD_BUTTON_5:0 "En fazla [GetDataModelSize(MapListPanel.AccessValidOptions)] vilayete 5 seviye ekle"
 BC_BUILD_BUTTON_10:0 "En fazla [GetDataModelSize(MapListPanel.AccessValidOptions)] vilayete 10 seviye ekle"
 BC_BUILD_TOOLTIP_1:0 "Aşağıda listelenen her vilayette bu binanın 1 seviyesini inşa sırasına ekler.\n\nOyunun inşaata izin vermediği vilayetler atlanır; bu yüzden [GetDataModelSize(MapListPanel.AccessValidOptions)] sayısından daha azı sıraya girebilir.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "Aşağıda listelenen her vilayette bu binanın 5 seviyesini inşa sırasına ekler.\n\nOyunun inşaata izin vermediği vilayetler atlanır; bu yüzden [GetDataModelSize(MapListPanel.AccessValidOptions)] sayısından daha azı sıraya girebilir.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "Aşağıda listelenen her vilayette bu binanın 10 seviyesini inşa sırasına ekler.\n\nOyunun inşaata izin vermediği vilayetler atlanır; bu yüzden [GetDataModelSize(MapListPanel.AccessValidOptions)] sayısından daha azı sıraya girebilir.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
