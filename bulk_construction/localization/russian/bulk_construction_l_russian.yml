 BC_BUILD_TOOLTIP_10:0 "Добавляет 10 уровней этого сооружения в очередь строительства в каждой перечисленной ниже области.\n\nОбласти, в которых игра не позволяет строить, пропускаются — поэтому добавлено может быть меньше [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_pen_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
