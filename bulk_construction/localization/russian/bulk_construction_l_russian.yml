 BC_BUILD_BUTTON_1:0 "(Build All) Добавить 1 уровень макс. в [GetDataModelSize(MapListPanel.AccessValidOptions)] областях"
 BC_BUILD_BUTTON_5:0 "(Build All) Добавить 5 уровней макс. в [GetDataModelSize(MapListPanel.AccessValidOptions)] областях"
 BC_BUILD_BUTTON_10:0 "(Build All) Добавить 10 уровней макс. в [GetDataModelSize(MapListPanel.AccessValidOptions)] областях"
 BC_BUILD_TOOLTIP_1:0 "Добавляет 1 уровень этого сооружения в очередь строительства в каждой перечисленной ниже области, где его действительно можно построить.\n\nОбласти, уже достигшие максимального уровня, или те, где у вас нет права на строительство, пропускаются — поэтому добавлено может быть меньше [GetDataModelSize(MapListPanel.AccessValidOptions)]. Эта кнопка нажимает ту же самую +, что нажали бы вы сами, по одному разу на область, поэтому она не может построить ничего, чего не могли бы построить вы."
