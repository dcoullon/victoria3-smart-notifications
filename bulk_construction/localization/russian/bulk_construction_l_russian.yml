l_russian:
 BC_LEVELS_LABEL:0 "Уровни:"
 BC_LEVELS_1:0 "1"
 BC_LEVELS_5:0 "5"
 BC_LEVELS_10:0 "10"
 BC_SECTION_TITLE:0 "Build All"
 BC_SECTION_SUMMARY:0 "[SelectLocalization(GetVariableSystem.Exists('bc_eff_on'), 'BC_SUMMARY_EFF', 'BC_SUMMARY')]"
 BC_SUMMARY:0 "Уровни: [Select_CString(GetVariableSystem.Exists('bc_levels'), GetVariableSystem.Get('bc_levels'), '1')]"
 BC_SUMMARY_EFF:0 "Уровни: [Select_CString(GetVariableSystem.Exists('bc_levels'), GetVariableSystem.Get('bc_levels'), '1')], мин. [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '70')]%"
 BC_EFF_LABEL:0 "Мин. эффективность:"
 BC_EFF_VALUE:0 "[Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '70')]%"
 BC_EFF_TOOLTIP:0 "Если отмечено, Build All пропускает каждую область, где эффективность строительства этого сооружения ниже этого порога. 70% означает штраф не более 30%: игра показывает его как -30% к эффективности строительства."
 BC_TOOLTIP_EFF:0 "\n\nОбласти с эффективностью строительства этого сооружения ниже [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '70')]% пропускаются."
 BC_TOOLTIP_CAP:0 "\n\nНедоступно: в очереди строительства уже 10 000 или больше объектов государственного строительства. Отмените часть или дождитесь, пока очередь сократится."
 BC_BUILD_BUTTON_1:0 "Добавить 1 уровень макс. в [GetDataModelSize(MapListPanel.AccessValidOptions)] областях"
 BC_BUILD_BUTTON_5:0 "Добавить 5 уровней макс. в [GetDataModelSize(MapListPanel.AccessValidOptions)] областях"
 BC_BUILD_BUTTON_10:0 "Добавить 10 уровней макс. в [GetDataModelSize(MapListPanel.AccessValidOptions)] областях"
 BC_BUILD_TOOLTIP_1:0 "Добавляет 1 уровень этого сооружения в очередь строительства в каждой перечисленной ниже области.\n\nОбласти, в которых игра не позволяет строить, пропускаются — поэтому добавлено может быть меньше [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "Добавляет 5 уровней этого сооружения в очередь строительства в каждой перечисленной ниже области.\n\nОбласти, в которых игра не позволяет строить, пропускаются — поэтому добавлено может быть меньше [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "Добавляет 10 уровней этого сооружения в очередь строительства в каждой перечисленной ниже области.\n\nОбласти, в которых игра не позволяет строить, пропускаются — поэтому добавлено может быть меньше [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
