l_japanese:
 BC_LEVELS_LABEL:0 "レベル："
 BC_LEVELS_1:0 "1"
 BC_LEVELS_5:0 "5"
 BC_LEVELS_10:0 "10"
 BC_SECTION_TITLE:0 "Build All"
 BC_SECTION_SUMMARY:0 "[SelectLocalization(GetVariableSystem.Exists('bc_eff_on'), 'BC_SUMMARY_EFF', 'BC_SUMMARY')]"
 BC_SUMMARY:0 "レベル：[Select_CString(GetVariableSystem.Exists('bc_levels'), GetVariableSystem.Get('bc_levels'), '1')]"
 BC_SUMMARY_EFF:0 "レベル：[Select_CString(GetVariableSystem.Exists('bc_levels'), GetVariableSystem.Get('bc_levels'), '1')]、最低 [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '70')]%"
 BC_EFF_LABEL:0 "最低建設効率："
 BC_EFF_VALUE:0 "[Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '70')]%"
 BC_EFF_TOOLTIP:0 "チェックすると、この施設の建設効率がこのしきい値を下回る州を Build All がスキップします。70% はペナルティが最大 30% であることを意味し、ゲームでは建設効率 -30% と表示されます。"
 BC_TOOLTIP_EFF:0 "\n\nこの施設の建設効率が [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '70')]% 未満の州はスキップされます。"
 BC_TOOLTIP_CAP:0 "\n\n無効：建設キューに政府の建設がすでに 10,000 件以上あります。いくつか取り消すか、キューが減るのを待ってください。"
 BC_BUILD_BUTTON_1:0 "最大 [GetDataModelSize(MapListPanel.AccessValidOptions)] 州にそれぞれ 1 レベル を予約"
 BC_BUILD_BUTTON_5:0 "最大 [GetDataModelSize(MapListPanel.AccessValidOptions)] 州にそれぞれ 5 レベル を予約"
 BC_BUILD_BUTTON_10:0 "最大 [GetDataModelSize(MapListPanel.AccessValidOptions)] 州にそれぞれ 10 レベル を予約"
 BC_BUILD_TOOLTIP_1:0 "下に表示されているすべての州で、この施設を 1 レベル ずつ建設キューに追加します。\n\nゲームが建設を許可しない州はスキップされるため、実際に予約される数は [GetDataModelSize(MapListPanel.AccessValidOptions)] より少なくなることがあります。[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "下に表示されているすべての州で、この施設を 5 レベル ずつ建設キューに追加します。\n\nゲームが建設を許可しない州はスキップされるため、実際に予約される数は [GetDataModelSize(MapListPanel.AccessValidOptions)] より少なくなることがあります。[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "下に表示されているすべての州で、この施設を 10 レベル ずつ建設キューに追加します。\n\nゲームが建設を許可しない州はスキップされるため、実際に予約される数は [GetDataModelSize(MapListPanel.AccessValidOptions)] より少なくなることがあります。[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
