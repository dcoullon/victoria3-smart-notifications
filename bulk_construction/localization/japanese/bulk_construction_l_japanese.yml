 BC_BUILD_TOOLTIP_10:0 "下に表示されているすべての州で、この施設を 10 レベル ずつ建設キューに追加します。\n\nゲームが建設を許可しない州はスキップされるため、実際に予約される数は [GetDataModelSize(MapListPanel.AccessValidOptions)] より少なくなることがあります。[AddLocalizationIf(GetVariableSystem.Exists('bc_pen_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
