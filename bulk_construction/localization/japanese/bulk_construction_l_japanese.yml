 BC_BUILD_TOOLTIP_1:0 "下に表示されている州のうち、実際に建設可能なすべての州で、この施設を 1 レベル ずつ建設キューに追加します。\n\nすでに最大レベルに達している州や、建設権のない州はスキップされるため、実際に予約される数は [GetDataModelSize(MapListPanel.AccessValidOptions)] より少なくなることがあります。このボタンはあなた自身が押すのと同じ + を州ごとに 1 回押すだけなので、あなたが建設できないものを建設することはできません。"
 BC_BUILD_TOOLTIP_5:0 "下に表示されている州のうち、実際に建設可能なすべての州で、この施設を 5 レベル ずつ建設キューに追加します。\n\nすでに最大レベルに達している州や、建設権のない州はスキップされるため、実際に予約される数は [GetDataModelSize(MapListPanel.AccessValidOptions)] より少なくなることがあります。このボタンはあなた自身が押すのと同じ + を州ごとに 1 回押すだけなので、あなたが建設できないものを建設することはできません。"
 BC_BUILD_TOOLTIP_10:0 "下に表示されている州のうち、実際に建設可能なすべての州で、この施設を 10 レベル ずつ建設キューに追加します。\n\nすでに最大レベルに達している州や、建設権のない州はスキップされるため、実際に予約される数は [GetDataModelSize(MapListPanel.AccessValidOptions)] より少なくなることがあります。このボタンはあなた自身が押すのと同じ + を州ごとに 1 回押すだけなので、あなたが建設できないものを建設することはできません。"
