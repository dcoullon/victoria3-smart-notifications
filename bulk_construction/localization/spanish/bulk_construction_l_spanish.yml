l_spanish:
 BC_LEVELS_LABEL:0 "(Build All) Niveles:"
 BC_LEVELS_1:0 "1"
 BC_LEVELS_5:0 "5"
 BC_LEVELS_10:0 "10"
 BC_EFF_LABEL:0 "(Build All) Eficiencia mín.:"
 BC_EFF_VALUE:0 "[Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')] %"
 BC_EFF_TOOLTIP:0 "Si está marcada, Build All omite todos los estados cuya eficiencia de construcción para este edificio esté por debajo de este umbral. Esa eficiencia es el porcentaje que aparece en cada fila de la lista de abajo."
 BC_TOOLTIP_EFF:0 "\n\nSe omiten los estados con menos del [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')] % de eficiencia de construcción para este edificio."
 BC_TOOLTIP_CAP:0 "\n\nDesactivado: tu cola de construcción ya tiene 10 000 o más construcciones gubernamentales. Cancela algunas o espera a que la cola avance."
 BC_BUILD_BUTTON_1:0 "(Build All) Añadir 1 nivel en hasta [GetDataModelSize(MapListPanel.AccessValidOptions)] estados"
 BC_BUILD_BUTTON_5:0 "(Build All) Añadir 5 niveles en hasta [GetDataModelSize(MapListPanel.AccessValidOptions)] estados"
 BC_BUILD_BUTTON_10:0 "(Build All) Añadir 10 niveles en hasta [GetDataModelSize(MapListPanel.AccessValidOptions)] estados"
 BC_BUILD_TOOLTIP_1:0 "Añade 1 nivel de este edificio a la cola de construcción en todos los estados listados abajo.\n\nLos estados en los que el juego no te deja construir se omiten, así que puede que se añadan menos de [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "Añade 5 niveles de este edificio a la cola de construcción en todos los estados listados abajo.\n\nLos estados en los que el juego no te deja construir se omiten, así que puede que se añadan menos de [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "Añade 10 niveles de este edificio a la cola de construcción en todos los estados listados abajo.\n\nLos estados en los que el juego no te deja construir se omiten, así que puede que se añadan menos de [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
