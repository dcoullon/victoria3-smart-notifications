 BC_BUILD_TOOLTIP_10:0 "Añade 10 niveles de este edificio a la cola de construcción en todos los estados listados abajo.\n\nLos estados en los que el juego no te deja construir se omiten, así que puede que se añadan menos de [GetDataModelSize(MapListPanel.AccessValidOptions)].[AddLocalizationIf(GetVariableSystem.Exists('bc_pen_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
