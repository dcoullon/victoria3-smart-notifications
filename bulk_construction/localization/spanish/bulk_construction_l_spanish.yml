 BC_BUILD_TOOLTIP_1:0 "Añade 1 nivel de este edificio a la cola de construcción en todos los estados listados abajo donde realmente se pueda construir.\n\nLos estados que ya están en su nivel máximo, o donde no tienes derecho a construir, se omiten, así que puede que se añadan menos de [GetDataModelSize(MapListPanel.AccessValidOptions)]. Este botón pulsa el mismo + que pulsarías tú, una vez por estado, así que nunca puede construir nada que tú no pudieras."
