 BC_BUILD_TOOLTIP_10:0 "在下方列出的每个地区，各将本建筑的 10 级 加入建造队列。\n\n游戏不允许建造的地区会被跳过，因此实际排队的数量可能少于 [GetDataModelSize(MapListPanel.AccessValidOptions)] 个。[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
