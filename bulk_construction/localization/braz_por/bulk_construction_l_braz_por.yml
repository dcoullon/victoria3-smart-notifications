l_braz_por:
 BC_LEVELS_LABEL:0 "(Build All) Níveis:"
 BC_LEVELS_1:0 "1"
 BC_LEVELS_5:0 "5"
 BC_LEVELS_10:0 "10"
 BC_EFF_LABEL:0 "(Build All) Eficiência mín.:"
 BC_EFF_VALUE:0 "[Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')]%"
 BC_EFF_TOOLTIP:0 "Se marcada, Build All ignora todos os estados cuja eficiência de construção para este edifício esteja abaixo deste limite. Essa eficiência é a porcentagem mostrada em cada linha da lista abaixo."
 BC_TOOLTIP_EFF:0 "\n\nEstados abaixo de [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')]% de eficiência de construção para este edifício são ignorados."
 BC_TOOLTIP_CAP:0 "\n\nDesativado: sua fila de obras já tem 10.000 ou mais obras do governo. Cancele algumas ou espere a fila diminuir."
 BC_BUILD_BUTTON_1:0 "(Build All) Enfileirar 1 nível em até [GetDataModelSize(MapListPanel.AccessValidOptions)] estados"
 BC_BUILD_BUTTON_5:0 "(Build All) Enfileirar 5 níveis em até [GetDataModelSize(MapListPanel.AccessValidOptions)] estados"
 BC_BUILD_BUTTON_10:0 "(Build All) Enfileirar 10 níveis em até [GetDataModelSize(MapListPanel.AccessValidOptions)] estados"
 BC_BUILD_TOOLTIP_1:0 "Adiciona 1 nível deste edifício à fila de obras em todos os estados listados abaixo.\n\nEstados nos quais o jogo não permite construir são ignorados, portanto menos de [GetDataModelSize(MapListPanel.AccessValidOptions)] podem ser enfileirados.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "Adiciona 5 níveis deste edifício à fila de obras em todos os estados listados abaixo.\n\nEstados nos quais o jogo não permite construir são ignorados, portanto menos de [GetDataModelSize(MapListPanel.AccessValidOptions)] podem ser enfileirados.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "Adiciona 10 níveis deste edifício à fila de obras em todos os estados listados abaixo.\n\nEstados nos quais o jogo não permite construir são ignorados, portanto menos de [GetDataModelSize(MapListPanel.AccessValidOptions)] podem ser enfileirados.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
