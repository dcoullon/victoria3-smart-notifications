l_french:
 BC_LEVELS_LABEL:0 "Niveaux :"
 BC_LEVELS_1:0 "1"
 BC_LEVELS_5:0 "5"
 BC_LEVELS_10:0 "10"
 BC_SECTION_TITLE:0 "Build All"
 BC_SUMMARY_EFF:0 "Pénalité max. [Select_CString(GetVariableSystem.Exists('bc_pen'), GetVariableSystem.Get('bc_pen'), '30')] %"
 BC_EFF_LABEL:0 "Pénalité de construction max. :"
 BC_EFF_VALUE:0 "[Select_CString(GetVariableSystem.Exists('bc_pen'), GetVariableSystem.Get('bc_pen'), '30')] %"
 BC_EFF_TOOLTIP:0 "Ne construit que dans les États où la pénalité d'efficacité de construction de ce bâtiment est de [Select_CString(GetVariableSystem.Exists('bc_pen'), GetVariableSystem.Get('bc_pen'), '30')] % ou moins."
 BC_TOOLTIP_EFF:0 "\n\nUniquement les États avec une pénalité d'efficacité de construction de [Select_CString(GetVariableSystem.Exists('bc_pen'), GetVariableSystem.Get('bc_pen'), '30')] % ou moins."
 BC_TOOLTIP_CAP:0 "\n\nDésactivé : votre file d'attente de construction contient déjà 10 000 constructions gouvernementales ou plus. Annulez-en, ou attendez qu'elle se vide."
 BC_BUILD_BUTTON_1:0 "Ajouter 1 niveau dans [GetDataModelSize(MapListPanel.AccessValidOptions)] États max."
 BC_BUILD_BUTTON_5:0 "Ajouter 5 niveaux dans [GetDataModelSize(MapListPanel.AccessValidOptions)] États max."
 BC_BUILD_BUTTON_10:0 "Ajouter 10 niveaux dans [GetDataModelSize(MapListPanel.AccessValidOptions)] États max."
 BC_BUILD_TOOLTIP_1:0 "Ajoute 1 niveau de ce bâtiment à la file d'attente de construction dans chaque État listé ci-dessous.\n\nLes États dans lesquels le jeu ne vous laisse pas construire sont ignorés : moins de [GetDataModelSize(MapListPanel.AccessValidOptions)] peuvent donc être ajoutés.[AddLocalizationIf(GetVariableSystem.Exists('bc_pen_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "Ajoute 5 niveaux de ce bâtiment à la file d'attente de construction dans chaque État listé ci-dessous.\n\nLes États dans lesquels le jeu ne vous laisse pas construire sont ignorés : moins de [GetDataModelSize(MapListPanel.AccessValidOptions)] peuvent donc être ajoutés.[AddLocalizationIf(GetVariableSystem.Exists('bc_pen_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "Ajoute 10 niveaux de ce bâtiment à la file d'attente de construction dans chaque État listé ci-dessous.\n\nLes États dans lesquels le jeu ne vous laisse pas construire sont ignorés : moins de [GetDataModelSize(MapListPanel.AccessValidOptions)] peuvent donc être ajoutés.[AddLocalizationIf(GetVariableSystem.Exists('bc_pen_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
