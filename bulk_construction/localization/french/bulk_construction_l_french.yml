 BC_BUILD_BUTTON_1:0 "(Build All) Ajouter 1 niveau dans [GetDataModelSize(MapListPanel.AccessValidOptions)] États max."
 BC_BUILD_BUTTON_5:0 "(Build All) Ajouter 5 niveaux dans [GetDataModelSize(MapListPanel.AccessValidOptions)] États max."
 BC_BUILD_BUTTON_10:0 "(Build All) Ajouter 10 niveaux dans [GetDataModelSize(MapListPanel.AccessValidOptions)] États max."
 BC_BUILD_TOOLTIP_1:0 "Ajoute 1 niveau de ce bâtiment à la file d'attente de construction dans chaque État listé ci-dessous où il peut réellement être construit.\n\nLes États déjà à leur niveau maximum, ou dans lesquels vous n'avez pas le droit de construire, sont ignorés : moins de [GetDataModelSize(MapListPanel.AccessValidOptions)] peuvent donc être ajoutés. Ce bouton appuie sur le même + que vous appuieriez vous-même, une fois par État ; il ne peut donc rien construire que vous ne pourriez pas construire."
