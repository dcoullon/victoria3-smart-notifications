l_french:
 BC_LEVELS_LABEL:0 "(Build All) Niveaux :"
 BC_LEVELS_1:0 "1"
 BC_LEVELS_5:0 "5"
 BC_LEVELS_10:0 "10"
 BC_EFF_LABEL:0 "(Build All) Efficacité min. :"
 BC_EFF_VALUE:0 "[Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')] %"
 BC_EFF_TOOLTIP:0 "Si coché, Build All ignore chaque État dont l'efficacité de construction pour ce bâtiment est inférieure à ce seuil. Cette efficacité est le pourcentage affiché sur chaque ligne de la liste ci-dessous."
 BC_TOOLTIP_EFF:0 "\n\nLes États sous [Select_CString(GetVariableSystem.Exists('bc_eff'), GetVariableSystem.Get('bc_eff'), '35')] % d'efficacité de construction pour ce bâtiment sont ignorés."
 BC_TOOLTIP_CAP:0 "\n\nDésactivé : votre file d'attente de construction contient déjà 10 000 constructions gouvernementales ou plus. Annulez-en, ou attendez qu'elle se vide."
 BC_BUILD_BUTTON_1:0 "(Build All) Ajouter 1 niveau dans [GetDataModelSize(MapListPanel.AccessValidOptions)] États max."
 BC_BUILD_BUTTON_5:0 "(Build All) Ajouter 5 niveaux dans [GetDataModelSize(MapListPanel.AccessValidOptions)] États max."
 BC_BUILD_BUTTON_10:0 "(Build All) Ajouter 10 niveaux dans [GetDataModelSize(MapListPanel.AccessValidOptions)] États max."
 BC_BUILD_TOOLTIP_1:0 "Ajoute 1 niveau de ce bâtiment à la file d'attente de construction dans chaque État listé ci-dessous.\n\nLes États dans lesquels le jeu ne vous laisse pas construire sont ignorés : moins de [GetDataModelSize(MapListPanel.AccessValidOptions)] peuvent donc être ajoutés.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_5:0 "Ajoute 5 niveaux de ce bâtiment à la file d'attente de construction dans chaque État listé ci-dessous.\n\nLes États dans lesquels le jeu ne vous laisse pas construire sont ignorés : moins de [GetDataModelSize(MapListPanel.AccessValidOptions)] peuvent donc être ajoutés.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
 BC_BUILD_TOOLTIP_10:0 "Ajoute 10 niveaux de ce bâtiment à la file d'attente de construction dans chaque État listé ci-dessous.\n\nLes États dans lesquels le jeu ne vous laisse pas construire sont ignorés : moins de [GetDataModelSize(MapListPanel.AccessValidOptions)] peuvent donc être ajoutés.[AddLocalizationIf(GetVariableSystem.Exists('bc_eff_on'), 'BC_TOOLTIP_EFF')][AddLocalizationIf(GreaterThanOrEqualTo_int32(GetPlayer.GetNumGovernmentConstructionsInQueue, '(int32)10000'), 'BC_TOOLTIP_CAP')]"
