l_english:
 # =====================================================================
 # ROUND 4 -- first pass at the REAL wording, not just markers.
 # Still throwaway in the sense that the (s#) tags come out before ship.
 #
 # SETTLED SO FAR (all observed in-game, cross-checked against the game's
 # own panels -- not inferred):
 #
 # 1. `localization/replace/english/` is the override mechanism.
 # 2. The engine uses the **_FIRST** variant when the subject is the player's
 #    own country: (R6) rendered, (R5) did not. Both were at :4, so the
 #    version suffix was never the cause -- the round-3 guess (a) was wrong
 #    and guess (b) was right. _THIRD still has to be overridden too, for
 #    effects on other countries.
 # 3. InterestGroup data is live and correct inside POP_EFFECT_FILTER:
 #    "Rural Folk pop=1.23M appr=2 clout=6.6%" matched the Rural Folk panel
 #    (1.2M / +2 / 6.6%) exactly.
 # 4. ADD_MODIFIER_THIRD + InterestGroup.IsValid works AND scopes correctly:
 #    the marker appeared on "Industrialists gets Rejected Petition" with
 #    now=7 clout=33.9%, matching the sidebar, and stayed OFF "Portugal gets
 #    Unresponsive Governance". That is the answer to "show approval
 #    everywhere it appears".
 # 5. interest_group_approval_add is dead: modifier labels render in a
 #    'Container' context, per error.log.
 #
 # WHAT ROUND 4 FIXES: the number shown was useless. It said
 # "total=46.6M" -- the whole country -- when the effect hits 2% of 1.23M
 # Rural Folk, i.e. about 24K people. The count has to be VALUE x the
 # FILTERED subgroup, so the arithmetic moves next to whichever filter is
 # actually valid.
 #
 # TWO THINGS THIS TESTS, both unproven:
 #   s1 -- is InterestGroup/Culture/Religion/PopType in scope in the PARENT
 #         template? R1 proved it inside POP_EFFECT_FILTER, which is a
 #         nested reference; the parent may not bind it.
 #   s2 -- does $VALUE$ propagate two levels down, and does
 #         Multiply_CFixedPoint accept it as an operand?
 # The "(s1 v=...)" tag shows the raw $VALUE$ so a wrong product can be told
 # apart from a missing one.
 #
 # LEGIBILITY: POP_EFFECT_FILTER_INTEREST_GROUP is restored to vanilla so
 # the sentence reads normally again; everything this mod adds now goes on
 # its own indented line underneath, which is the layout to judge.
 # =====================================================================

 # --- Restored to vanilla exactly: the inline version made the sentence
 # --- unreadable ("Rural Folk (R1 pop=... ) members of Pops in Portugal").
 POP_EFFECT_FILTER_INTEREST_GROUP: "[InterestGroup.GetName] members of "

 # ---------------------------------------------------------------------
 # The pop-effect templates. Vanilla text preserved verbatim; our line is
 # appended. _FIRST is the player's own country, _THIRD is everyone else.
 # ---------------------------------------------------------------------
 ADD_RADICALS_FIRST:4 "$VALUE|-=1%$ of $FILTER_DESC$ in [COUNTRY.GetNameNoFlag] become more [concept_radical]$BDI_AFFECTED_IN_COUNTRY$"
 ADD_RADICALS_THIRD:4 "$VALUE|-=1%$ of $FILTER_DESC$ in [COUNTRY.GetName] become more [concept_radical]$BDI_AFFECTED_IN_COUNTRY$"
 ADD_LOYALISTS_FIRST:4 "$VALUE|+=1%$ of $FILTER_DESC$ in [COUNTRY.GetNameNoFlag] become more [concept_loyalist]$BDI_AFFECTED_IN_COUNTRY$"
 ADD_LOYALISTS_THIRD:4 "$VALUE|+=1%$ of $FILTER_DESC$ in [COUNTRY.GetName] become more [concept_loyalist]$BDI_AFFECTED_IN_COUNTRY$"

 # State-scoped. Still unobserved -- needs an event whose effect says
 # "in <state>" rather than "in Portugal".
 ADD_RADICALS_IN_STATE_THIRD: "$VALUE|-=1%$ of $FILTER_DESC$ in [STATE.GetName] become more [concept_radical]$BDI_AFFECTED_IN_STATE$"
 ADD_LOYALISTS_IN_STATE_THIRD: "$VALUE|+=1%$ of $FILTER_DESC$ in [STATE.GetName] become more [concept_loyalist]$BDI_AFFECTED_IN_STATE$"

 # ---------------------------------------------------------------------
 # The added line. Exactly one branch should fire, picked by whichever
 # filter the effect actually used. If none fires, the effect was unfiltered
 # (15.8% of all cases) and the country total is the honest answer.
 # ---------------------------------------------------------------------
 BDI_AFFECTED_IN_COUNTRY:0 "\n$TAB$#indent_newline:3 (s1 v=$VALUE$) [AddLocalizationIf(InterestGroup.IsValid, 'BDI_AFF_IG')][AddLocalizationIf(Culture.IsValid, 'BDI_AFF_CULTURE')][AddLocalizationIf(Religion.IsValid, 'BDI_AFF_RELIGION')][AddLocalizationIf(PopType.IsValid, 'BDI_AFF_POPTYPE')]#!"

 BDI_AFFECTED_IN_STATE:0 "\n$TAB$#indent_newline:3 (s3) about [Multiply_CFixedPoint('$VALUE$', STATE.GetPopulationSize)|K] of [STATE.GetPopulationSize|K] people in [STATE.GetName]#!"

 BDI_AFF_IG:0 "about #v [Multiply_CFixedPoint('$VALUE$', InterestGroup.GetPopulation)|K]#! of [InterestGroup.GetPopulation|K] [InterestGroup.GetName] -- approval #v [InterestGroup.GetApprovalValue]#!, clout #v [InterestGroup.GetClout|%1]#!"

 BDI_AFF_CULTURE:0 "about #v [Multiply_CFixedPoint('$VALUE$', Culture.GetPopulation)|K]#! of [Culture.GetPopulation|K] [Culture.GetName] pops"

 BDI_AFF_RELIGION:0 "about #v [Multiply_CFixedPoint('$VALUE$', Religion.GetPopulation)|K]#! of [Religion.GetPopulation|K] [Religion.GetName] pops"

 BDI_AFF_POPTYPE:0 "about #v [Multiply_CFixedPoint('$VALUE$', PopType.GetPopulation(GetPlayer))|K]#! of [PopType.GetPopulation(GetPlayer)|K] [PopType.GetName]"

 # ---------------------------------------------------------------------
 # CONFIRMED WORKING -- kept, with the wording tightened toward final.
 # Renders on every interest-group modifier, anywhere in the game, and
 # correctly stays off non-interest-group ones.
 # ---------------------------------------------------------------------
 ADD_MODIFIER_THIRD:0 "$SUBJECT_NAME$ gets #tooltippable #tooltip:[GetRawTextTooltipTag('$ADD_MODIFIER_BREAKDOWN$')] $MODIFIER_NAME$#!#! $MAYBE_DECAYING_WITH_SPACE_AFTER$$DURATION$\n$TAB$#indent_newline:3 $MODIFIER_DESC$#![AddLocalizationIf(InterestGroup.IsValid, 'BDI_IG_STANDING')]"

 BDI_IG_STANDING:0 "\n$TAB$#indent_newline:3 (s2) currently #v [InterestGroup.GetApprovalValue]#! approval, #v [InterestGroup.GetClout|%1]#! clout#!"
