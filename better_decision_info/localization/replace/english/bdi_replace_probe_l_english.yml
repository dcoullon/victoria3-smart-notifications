l_english:
 # =====================================================================
 # ROUND 8. Round 6 gave a clean, and awkward, result:
 #
 #   "(s5 v=VALUE add=5 country= state=)"  and  "(about of 1.23M)"
 #
 # 1. $VALUE$ does NOT reach POP_EFFECT_FILTER -- it printed the literal
 #    word "VALUE", i.e. an unrecognised parameter renders as its own name.
 #    In the PARENT it works ("(s1 v=0.02)" in round 5).
 # 2. Add_CFixedPoint EXISTS -- "add=5" from 2+3. The user's
 #    strata-by-profession decomposition is therefore arithmetically
 #    possible after all; the blocker there is only the hierarchy-dependent
 #    profession list, not the summation.
 # 3. COUNTRY and STATE do NOT bind in POP_EFFECT_FILTER (both empty).
 # 4. InterestGroup.GetPopulation works there (1.23M), but the product came
 #    out blank because its operand was the string "VALUE".
 #
 # SO THE TWO HALVES LIVE IN DIFFERENT CONTEXTS:
 #   parent template      -> $VALUE$, $STRATA$(?), COUNTRY, STATE
 #   POP_EFFECT_FILTER    -> InterestGroup, Culture, Religion, PopType
 # and neither can see the other's half. That is the whole difficulty.
 #
 # THIS ROUND SPLITS THE WORK ACCORDINGLY:
 #   - filter-object cases get the SUBGROUP TOTAL inline, which is proven to
 #     work today and needs nothing unverified. Combined with vanilla's own
 #     "+2.0%" the reader has both numbers even without the multiplication.
 #   - the strata case moves to the PARENT, where COUNTRY and $VALUE$ are
 #     both available, so there the full product IS computable.
 #   - (s7) hunts for the parameter name the value arrives under inside
 #     POP_EFFECT_FILTER. An unknown parameter renders as its own name, so
 #     any of these coming back as a NUMBER instead of a word is the answer,
 #     and would unlock the exact product for every filter case.
 # =====================================================================

 # ---------------------------------------------------------------------
 # Subgroup total inline. Proven working: "1.23M" rendered correctly and
 # matched the Rural Folk panel.
 # (s7) probes candidate parameter names for the effect's magnitude.
 # ---------------------------------------------------------------------
 POP_EFFECT_FILTER: "[AddLocalizationIf(InterestGroup.IsValid, 'POP_EFFECT_FILTER_INTEREST_GROUP')][AddLocalizationIf(Culture.IsValid, 'POP_EFFECT_FILTER_CULTURE')][AddLocalizationIf(Religion.IsValid, 'POP_EFFECT_FILTER_RELIGION')][AddLocalizationIf(PopType.IsValid, 'POP_EFFECT_FILTER_POP_TYPE')][AddTextIf(Not(EqualTo_string('none', '$STRATA$')), Concatenate(Localize('$STRATA$'), ' '))][Concept('concept_pop', '$concept_pops$')] (s7 $VAL$ $AMOUNT$ $PERCENT$ $NUM$ $QUANTITY$)[AddLocalizationIf(InterestGroup.IsValid, 'BDI_SIZE_IG')][AddLocalizationIf(Culture.IsValid, 'BDI_SIZE_CULTURE')][AddLocalizationIf(Religion.IsValid, 'BDI_SIZE_RELIGION')][AddLocalizationIf(PopType.IsValid, 'BDI_SIZE_POPTYPE')]"

 POP_EFFECT_FILTER_INTEREST_GROUP: "[InterestGroup.GetName] members of "
 POP_EFFECT_FILTER_CULTURE: "[Culture.GetName] "
 POP_EFFECT_FILTER_RELIGION: "[Religion.GetName] "
 POP_EFFECT_FILTER_POP_TYPE: "[PopType.GetName] "

 BDI_SIZE_IG:0 " (#b [InterestGroup.GetPopulation|K]#! strong)"
 BDI_SIZE_CULTURE:0 " (#b [Culture.GetPopulation|K]#! strong)"
 BDI_SIZE_RELIGION:0 " (#b [Religion.GetPopulation|K]#! strong)"
 BDI_SIZE_POPTYPE:0 " (#b [PopType.GetPopulation(GetPlayer)|K]#! strong)"

 # ---------------------------------------------------------------------
 # Parent templates, back ONLY for the strata case -- the one place where
 # both halves of the calculation are in the same context. (s8) confirms
 # $STRATA$ actually reaches the parent; it is passed down to
 # POP_EFFECT_FILTER, so it should, but that has not been observed directly.
 # ---------------------------------------------------------------------
 ADD_RADICALS_FIRST:4 "$VALUE|-=1%$ of $FILTER_DESC$ in [COUNTRY.GetNameNoFlag] become more [concept_radical]$BDI_STRATA_COUNT$"
 ADD_RADICALS_THIRD:4 "$VALUE|-=1%$ of $FILTER_DESC$ in [COUNTRY.GetName] become more [concept_radical]$BDI_STRATA_COUNT$"
 ADD_LOYALISTS_FIRST:4 "$VALUE|+=1%$ of $FILTER_DESC$ in [COUNTRY.GetNameNoFlag] become more [concept_loyalist]$BDI_STRATA_COUNT$"
 ADD_LOYALISTS_THIRD:4 "$VALUE|+=1%$ of $FILTER_DESC$ in [COUNTRY.GetName] become more [concept_loyalist]$BDI_STRATA_COUNT$"

 BDI_STRATA_COUNT:0 " (s8 strata=$STRATA$)[AddTextIf(EqualTo_string('lower', '$STRATA$'), Localize('BDI_STRATA_LOWER'))][AddTextIf(EqualTo_string('middle', '$STRATA$'), Localize('BDI_STRATA_MIDDLE'))][AddTextIf(EqualTo_string('upper', '$STRATA$'), Localize('BDI_STRATA_UPPER'))]"

 BDI_STRATA_LOWER:0 " -- about #b [Multiply_CFixedPoint('$VALUE$', GetTrendValue(COUNTRY.GetLowerStrataPopulationTrend))|K]#! of [GetTrendValue(COUNTRY.GetLowerStrataPopulationTrend)|K]"
 BDI_STRATA_MIDDLE:0 " -- about #b [Multiply_CFixedPoint('$VALUE$', GetTrendValue(COUNTRY.GetMiddleStrataPopulationTrend))|K]#! of [GetTrendValue(COUNTRY.GetMiddleStrataPopulationTrend)|K]"
 BDI_STRATA_UPPER:0 " -- about #b [Multiply_CFixedPoint('$VALUE$', GetTrendValue(COUNTRY.GetUpperStrataPopulationTrend))|K]#! of [GetTrendValue(COUNTRY.GetUpperStrataPopulationTrend)|K]"

 # ---------------------------------------------------------------------
 # Modifier line. Interest-group standing is CONFIRMED WORKING and inline.
 # State scale is new and untested -- (s6) marks the unknown binding name.
 # ---------------------------------------------------------------------
 ADD_MODIFIER_THIRD:0 "$SUBJECT_NAME$ gets #tooltippable #tooltip:[GetRawTextTooltipTag('$ADD_MODIFIER_BREAKDOWN$')] $MODIFIER_NAME$#!#! $MAYBE_DECAYING_WITH_SPACE_AFTER$$DURATION$\n$TAB$#indent_newline:3 $MODIFIER_DESC$#![AddLocalizationIf(InterestGroup.IsValid, 'BDI_IG_STANDING')][AddLocalizationIf(State.IsValid, 'BDI_STATE_STANDING')]"

 BDI_IG_STANDING:0 " (Currently #b [InterestGroup.GetApprovalValue|+=]#! with #b [InterestGroup.GetClout|%0]#! clout)"

 BDI_STATE_STANDING:0 " (s6 [State.GetName]: #b [State.GetPopulationSize|K]#! people, [Divide_CFixedPoint(State.GetPopulationSize, State.GetCountry.GetTotalPopulation)|%1] of the country)"
