l_english:
 # =====================================================================
 # ROUND 6 -- and a structural simplification.
 #
 # WHAT ROUND 5 SETTLED: the filter objects are NOT bound in the parent
 # ADD_RADICALS_* template. "(s1 v=0.02)" rendered with nothing after it,
 # and error.log logged NO failure for BDI_AFF_IG -- so InterestGroup.IsValid
 # was simply false there, not broken. $VALUE$ propagates fine; the scopes
 # do not. R1 already proved those same objects ARE live inside
 # POP_EFFECT_FILTER.
 #
 # CONSEQUENCE: everything moves into POP_EFFECT_FILTER, and the four
 # ADD_RADICALS_*/ADD_LOYALISTS_* overrides are DROPPED entirely. That is
 # strictly better:
 #   - four fewer vanilla templates to keep in sync across patches
 #   - it automatically covers every template that uses $FILTER_DESC$ --
 #     ADD_RADICALS, _FIRST, _THIRD, _IN_STATE_THIRD, both ADD_LOYALISTS
 #     families, and KILL_POPULATION* as well
 #   - no more guessing which variant the engine picked (the _FIRST vs
 #     _THIRD hunt becomes irrelevant)
 # Two overridden keys total now, down from seven.
 #
 # COST: the text lands mid-sentence, right after "Pops", because that is
 # where $FILTER_DESC$ sits:
 #   "+2.0% of Rural Folk members of Pops (about 24K of 1.23M) in Portugal
 #    become more Radical"
 # Judge that on this run. If it reads badly the fallback is to go back to
 # per-template overrides and accept the maintenance cost.
 #
 # (s5) probes four unknowns at once, on every pop effect -- so unlike the
 # round-5 (s4) probe, which was attached to the state branch and therefore
 # never rendered at all, this one cannot hide:
 #   v=        does $VALUE$ reach here (needed for the multiplication)
 #   add=      does Add_CFixedPoint exist (2+3 should print 5) -- decides
 #             whether the exact strata-by-profession decomposition is even
 #             possible, per the user's suggestion
 #   country=  is COUNTRY bound here (needed for the strata branch)
 #   state=    is STATE bound here (needed for state-scoped effects)
 # =====================================================================

 POP_EFFECT_FILTER: "[AddLocalizationIf(InterestGroup.IsValid, 'POP_EFFECT_FILTER_INTEREST_GROUP')][AddLocalizationIf(Culture.IsValid, 'POP_EFFECT_FILTER_CULTURE')][AddLocalizationIf(Religion.IsValid, 'POP_EFFECT_FILTER_RELIGION')][AddLocalizationIf(PopType.IsValid, 'POP_EFFECT_FILTER_POP_TYPE')][AddTextIf(Not(EqualTo_string('none', '$STRATA$')), Concatenate(Localize('$STRATA$'), ' '))][Concept('concept_pop', '$concept_pops$')] (s5 v=$VALUE$ add=[Add_CFixedPoint('(CFixedPoint)2', '(CFixedPoint)3')] country=[COUNTRY.GetNameNoFlag] state=[STATE.GetName])[AddLocalizationIf(InterestGroup.IsValid, 'BDI_AFF_IG')][AddLocalizationIf(Culture.IsValid, 'BDI_AFF_CULTURE')][AddLocalizationIf(Religion.IsValid, 'BDI_AFF_RELIGION')][AddLocalizationIf(PopType.IsValid, 'BDI_AFF_POPTYPE')]"

 POP_EFFECT_FILTER_INTEREST_GROUP: "[InterestGroup.GetName] members of "
 POP_EFFECT_FILTER_CULTURE: "[Culture.GetName] "
 POP_EFFECT_FILTER_RELIGION: "[Religion.GetName] "
 POP_EFFECT_FILTER_POP_TYPE: "[PopType.GetName] "

 # ---------------------------------------------------------------------
 # The affected count. These run in the context where the filter objects
 # are proven live (R1 rendered "pop=1.23M appr=2 clout=6.6%" here and the
 # numbers matched the game's own panels exactly).
 #
 # Each prints the product AND the subgroup total, so an implausible
 # product is obvious rather than quietly trusted.
 # ---------------------------------------------------------------------
 BDI_AFF_IG:0 " (about #b [Multiply_CFixedPoint('$VALUE$', InterestGroup.GetPopulation)|K]#! of [InterestGroup.GetPopulation|K])"
 BDI_AFF_CULTURE:0 " (about #b [Multiply_CFixedPoint('$VALUE$', Culture.GetPopulation)|K]#! of [Culture.GetPopulation|K])"
 BDI_AFF_RELIGION:0 " (about #b [Multiply_CFixedPoint('$VALUE$', Religion.GetPopulation)|K]#! of [Religion.GetPopulation|K])"
 BDI_AFF_POPTYPE:0 " (about #b [Multiply_CFixedPoint('$VALUE$', PopType.GetPopulation(GetPlayer))|K]#! of [PopType.GetPopulation(GetPlayer)|K])"

 # ---------------------------------------------------------------------
 # CONFIRMED WORKING. Now INLINE rather than on its own line, per the user --
 # it follows straight after "-5 Interest Group Approval" instead of
 # breaking to a new row.
 #
 # NOTE ON ROUNDING: |%0 truncates, so the Landowners line read "6% clout"
 # while the sidebar showed 6.7%. A player cross-checking will spot the
 # mismatch. |%1 would show 6.7% and agree with the panel; flagged rather
 # than changed, since whole percent was the explicit request.
 # ---------------------------------------------------------------------
 ADD_MODIFIER_THIRD:0 "$SUBJECT_NAME$ gets #tooltippable #tooltip:[GetRawTextTooltipTag('$ADD_MODIFIER_BREAKDOWN$')] $MODIFIER_NAME$#!#! $MAYBE_DECAYING_WITH_SPACE_AFTER$$DURATION$\n$TAB$#indent_newline:3 $MODIFIER_DESC$#![AddLocalizationIf(InterestGroup.IsValid, 'BDI_IG_STANDING')][AddLocalizationIf(State.IsValid, 'BDI_STATE_STANDING')]"

 BDI_IG_STANDING:0 " (Currently #b [InterestGroup.GetApprovalValue|+=]#! with #b [InterestGroup.GetClout|%0]#! clout)"

 # ---------------------------------------------------------------------
 # NEW: state context on a modifier line -- "does this state even matter?"
 #
 # The North Angola event is the case that needs it. Its option carries no
 # pop effect at all, only two add_modifiers, so POP_EFFECT_FILTER is never
 # invoked and nothing we put there can ever appear. That is why (s5) was
 # absent twice: not broken, never called. State scale therefore has to ride
 # on the modifier line instead, exactly parallel to the interest-group one.
 #
 # State.GetCountry is used rather than the COUNTRY scope, since COUNTRY is
 # not known to bind in this template and State.GetCountry has vanilla
 # precedent. The share is what actually answers "should I care" -- 450K
 # people means little until you know it is 0.4% of Portugal.
 #
 # (s6) stays until this is seen working; the binding name is the unknown
 # (PascalCase `State` here, versus the uppercase STATE used in the
 # ADD_RADICALS_* family). If (s6) never appears, try STATE.IsValid instead.
 # ---------------------------------------------------------------------
 BDI_STATE_STANDING:0 " (s6 [State.GetName]: #b [State.GetPopulationSize|K]#! people, [Divide_CFixedPoint(State.GetPopulationSize, State.GetCountry.GetTotalPopulation)|%1] of the country)"
