l_english:
 # =====================================================================
 # BETTER DECISION INFO -- event tooltip enrichment.
 #
 # Shows how large the group is that an event option actually affects, so
 # "+2.0% of Bedouin Pops become more Radical" stops being unreadable.
 #
 # Two vanilla keys overridden, both via localization/replace/english/,
 # which is the only arrangement the engine honours (a plain
 # localization/english/ file loses the key to vanilla -- confirmed by
 # "Duplicate localization key" warnings in error.log).
 #
 # ---------------------------------------------------------------------
 # WHAT WAS CUT, AND WHY -- 2026-09-14
 #
 # Two further features worked on screen and were cut for log pollution:
 #   - interest-group standing  "(Currently +2 with 6% clout)"
 #   - state scale              "(703K people, 1% of the country)"
 #
 # Both hung off ADD_MODIFIER_THIRD, which renders for EVERY add_modifier
 # in the game -- countries, states, characters, buildings. When the
 # subject is not the type the guard asks about, the scope is ABSENT
 # rather than invalid, so the guard cannot be evaluated and the engine
 # writes four lines per render:
 #   "No context supplied (Use SetDataContext), wanted context of type
 #    'State' for 'State.IsValid'"
 #
 # Measured over roughly one game-year of play: 2003 lines in error.log,
 # 1995 of them ours. Extrapolated across a full campaign that is six
 # figures, in every player's install -- and scan_logs.py is how we judge
 # whether Smart Notifications is healthy, so it would bury real errors in
 # the mod that is already live.
 #
 # Three guard forms were tried against each other before cutting:
 # AddLocalizationIf (91 failures), AddTextIf+Localize (91),
 # SelectLocalization with empty else (92). All three render correctly and
 # all three log identically -- the condition itself is what fails, not the
 # wrapper. Vanilla offers no scope-existence test (its only Exists() is
 # GetVariableSystem.Exists, for GUI variables) and there are no
 # subject-typed modifier templates, only ADD_MODIFIER/_FIRST/_THIRD.
 #
 # Also closed, same session: "how many lower strata live in this state".
 # That line is a modifier LABEL, and labels render in a 'Container'
 # context with nothing bound -- "(s11 state= laborers=)" came back empty,
 # matching interest_group_approval_add's earlier failure.
 #
 # Restoring any of this is one commit away (see git history around
 # 2026-09-14) if the log cost is ever judged acceptable.
 # ---------------------------------------------------------------------
 #
 # THIS FILE PRODUCES NO ERROR.LOG OUTPUT AT ALL. POP_EFFECT_FILTER always
 # binds its filter scopes, so IsValid returns false instead of failing --
 # confirmed: zero BDI_SIZE_* lines across the same 2003-line sample.
 # =====================================================================

 # Size shows only when EXACTLY ONE filter applies. 68 of 1376 vanilla pop
 # effects (4.9%) combine two or more -- culture+pop_type, culture+strata,
 # pop_type+religion and so on -- and for those the affected group is an
 # INTERSECTION that no accessor exposes. Printing either single size there
 # would be authoritative-looking and wrong, so those fall through to
 # vanilla's untouched text.
 POP_EFFECT_FILTER: "[AddLocalizationIf(InterestGroup.IsValid, 'POP_EFFECT_FILTER_INTEREST_GROUP')][AddLocalizationIf(Culture.IsValid, 'POP_EFFECT_FILTER_CULTURE')][AddLocalizationIf(Religion.IsValid, 'POP_EFFECT_FILTER_RELIGION')][AddLocalizationIf(PopType.IsValid, 'POP_EFFECT_FILTER_POP_TYPE')][AddTextIf(Not(EqualTo_string('none', '$STRATA$')), Concatenate(Localize('$STRATA$'), ' '))][Concept('concept_pop', '$concept_pops$')][AddLocalizationIf(And(And4(InterestGroup.IsValid, Not(Culture.IsValid), Not(Religion.IsValid), Not(PopType.IsValid)), EqualTo_string('none', '$STRATA$')), 'BDI_SIZE_IG')][AddLocalizationIf(And(And4(Culture.IsValid, Not(InterestGroup.IsValid), Not(Religion.IsValid), Not(PopType.IsValid)), EqualTo_string('none', '$STRATA$')), 'BDI_SIZE_CULTURE')][AddLocalizationIf(And(And4(Religion.IsValid, Not(InterestGroup.IsValid), Not(Culture.IsValid), Not(PopType.IsValid)), EqualTo_string('none', '$STRATA$')), 'BDI_SIZE_RELIGION')][AddLocalizationIf(And(And4(PopType.IsValid, Not(InterestGroup.IsValid), Not(Culture.IsValid), Not(Religion.IsValid)), EqualTo_string('none', '$STRATA$')), 'BDI_SIZE_POPTYPE')][AddTextIf(And(And4(Not(InterestGroup.IsValid), Not(Culture.IsValid), Not(Religion.IsValid), Not(PopType.IsValid)), EqualTo_string('lower', '$STRATA$')), Localize('BDI_SIZE_STRATA_LOWER'))][AddTextIf(And(And4(Not(InterestGroup.IsValid), Not(Culture.IsValid), Not(Religion.IsValid), Not(PopType.IsValid)), EqualTo_string('middle', '$STRATA$')), Localize('BDI_SIZE_STRATA_MIDDLE'))][AddTextIf(And(And4(Not(InterestGroup.IsValid), Not(Culture.IsValid), Not(Religion.IsValid), Not(PopType.IsValid)), EqualTo_string('upper', '$STRATA$')), Localize('BDI_SIZE_STRATA_UPPER'))]"

 # ---------------------------------------------------------------------
 # State-scoped effects also get the state's own size, because the figure
 # above is NATIONAL and these effects hit one state -- 422 of the 1090
 # single-filter effects (39%). The intersection (Czechs *in Bohemia*) is
 # not computable: it needs STATE and the filter object in one context, and
 # they never share one. So both bounds are shown instead of a wrong number:
 #
 #   +5.0% of Czech Pops (1.2M nationwide) in Bohemia (2.1M inhabitants)
 #   become more Radical
 #
 # Safe to use STATE here, unlike in POP_EFFECT_FILTER: these two templates
 # are invoked ONLY for add_*_in_state effects, so STATE is always bound.
 # They are not polymorphic, which is the whole test for whether a scope
 # can be touched (see docs/engine-notes.md).
 #
 # Vanilla ships both without a version suffix; matched here.
 ADD_RADICALS_IN_STATE_THIRD: "$VALUE|-=1%$ of $FILTER_DESC$ in [STATE.GetName] (#b [STATE.GetPopulationSize|K]#! inhabitants) become more [concept_radical]"
 ADD_LOYALISTS_IN_STATE_THIRD: "$VALUE|+=1%$ of $FILTER_DESC$ in [STATE.GetName] (#b [STATE.GetPopulationSize|K]#! inhabitants) become more [concept_loyalist]"

 # Vanilla bodies, unchanged -- listed because overriding the parent above
 # means these must exist in the same file.
 POP_EFFECT_FILTER_INTEREST_GROUP: "[InterestGroup.GetName] members of "
 POP_EFFECT_FILTER_CULTURE: "[Culture.GetName] "
 POP_EFFECT_FILTER_RELIGION: "[Religion.GetName] "
 POP_EFFECT_FILTER_POP_TYPE: "[PopType.GetName] "

 # Confirmed in game against the game's own panels: Rural Folk rendered
 # 1.23M against a panel reading 1.2M.
 BDI_SIZE_IG:0 " (#b [InterestGroup.GetPopulation|K]#! nationwide)"
 BDI_SIZE_CULTURE:0 " (#b [Culture.GetPopulation(GetPlayer)|K]#! nationwide)"
 BDI_SIZE_RELIGION:0 " (#b [Religion.GetPopulation(GetPlayer)|K]#! nationwide)"
 BDI_SIZE_POPTYPE:0 " (#b [PopType.GetPopulation(GetPlayer)|K]#! nationwide)"

 # Strata totals need a country and COUNTRY does not bind here, so these use
 # GetPlayer. An audit of all 246 strata-filtered pop effects in vanilla
 # found ZERO that apply to a country other than the event's own, so that is
 # safe. (s9) stays until one is actually seen rendering in game -- no
 # strata-filtered pop effect has turned up yet.
 BDI_SIZE_STRATA_LOWER:0 " (s9 #b [GetTrendValue(GetPlayer.GetLowerStrataPopulationTrend)|K]#! nationwide)"
 BDI_SIZE_STRATA_MIDDLE:0 " (s9 #b [GetTrendValue(GetPlayer.GetMiddleStrataPopulationTrend)|K]#! nationwide)"
 BDI_SIZE_STRATA_UPPER:0 " (s9 #b [GetTrendValue(GetPlayer.GetUpperStrataPopulationTrend)|K]#! nationwide)"
