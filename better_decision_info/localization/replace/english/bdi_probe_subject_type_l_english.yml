l_english:
 # =====================================================================
 # THROWAWAY PROBE -- delete once answered (one file, one deletion).
 #
 # GOAL: get the interest-group standing line back without the log spam.
 # Guarding on "is the subject an interest group?" writes four error.log
 # lines whenever it isn't, because the scope is ABSENT rather than invalid
 # so the condition cannot be evaluated. 1995 of 2003 lines in one
 # game-year.
 #
 # RULED OUT ALREADY:
 #  - three guard WRAPPERS (AddLocalizationIf / AddTextIf+Localize /
 #    SelectLocalization) -- all three log identically, so the condition is
 #    what fails, not the wrapper
 #  - subject-typed templates -- only ADD_MODIFIER/_FIRST/_THIRD exist
 #  - the Container type -- the data_types dump shows it exposes only
 #    AccessSelf and Self, both [unregistered], zero arguments
 #  - context-type introspection -- no global function in the dump returns
 #    the current context's type as a comparable value
 #
 # TWO CANDIDATES LEFT, both tested here in one run.
 #
 # (D) GLOBAL IsValid( Arg0 ). The data types dump lists this as a global
 #     function returning bool -- a DIFFERENT thing from the X.IsValid
 #     method used so far. If argument evaluation is lazier than method
 #     dispatch, it may tolerate an unbound scope. Honestly a long shot:
 #     IsValid(InterestGroup.Self) still has to evaluate InterestGroup.Self
 #     to build the argument. But it is the only untried mechanism and the
 #     test is nearly free.
 #     PASS = "(D)" shows on an interest-group modifier AND 'BDI_G_D' never
 #     appears in error.log afterwards.
 #
 # (P) SUBJECT TYPE AS A PARAMETER. $SUBJECT_NAME$ exists, so the engine
 #     does pass the subject in. If its TYPE also arrives as a string, then
 #     EqualTo_string guards it and binds nothing, so it cannot error.
 #     An unrecognised parameter echoes its own name (proven: $VALUE$
 #     printed "VALUE"), so any candidate coming back as a lowercase type
 #     word -- state, interest_group, country, character, building -- wins.
 #
 # If both fail, the feature is genuinely not buildable and the cut stands.
 # =====================================================================
 ADD_MODIFIER_THIRD:0 "$SUBJECT_NAME$[AddLocalizationIf(IsValid(InterestGroup.Self), 'BDI_G_D')] (P: 1=$SUBJECT_TYPE$ 2=$TYPE$ 3=$SUBJECT$ 4=$SCOPE_TYPE$ 5=$TARGET_TYPE$ 6=$SUBJECT_SCOPE$) gets #tooltippable #tooltip:[GetRawTextTooltipTag('$ADD_MODIFIER_BREAKDOWN$')] $MODIFIER_NAME$#!#! $MAYBE_DECAYING_WITH_SPACE_AFTER$$DURATION$\n$TAB$#indent_newline:3 $MODIFIER_DESC$#!"

 BDI_G_D:0 " (D)"
