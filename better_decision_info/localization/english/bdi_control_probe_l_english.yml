l_english:
 # THROWAWAY CONTROL -- delete with the rest of the probe.
 #
 # Deliberately placed in the NORMAL localization/english/ folder, i.e. the
 # arrangement that already lost to vanilla once (error.log, 21:45:44).
 # Its only job is to make the comparison unambiguous in a single run:
 #
 #   (R1) appears, (N1) does not  -> localization/replace/ is the mechanism
 #   neither appears              -> engine templates cannot be overridden
 #   both appear                  -> round 1 failed for some other reason
 #                                   and the replace/ folder is unnecessary
 #
 # Expect a "Duplicate localization key" warning for this key in error.log.
 # That warning is the control working as intended, not a mistake.
 POP_EFFECT_FILTER_POP_TYPE: "[PopType.GetName] (N1) "
