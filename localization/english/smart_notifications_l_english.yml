 # (originally scoped to Message-Settings-visible labels only) to this
 # in-panel checkbox label as well. Wording tightened same day ("Notify
 # Me" alone was too vague about what it does); sentence case per the
 # user -- only the leading word and the pronoun "I" are capitalized, not
 # every word.
