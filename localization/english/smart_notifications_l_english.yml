 # Truce expiry watcher (see 02_smart_notifications_truce_tracker.txt).
 # The "(SN) " prefix on the *settings-list label* (not the in-game toast
 # text itself, which stays a plain sentence) is a mod-wide convention --
 # see CLAUDE.md/engine-notes.md "Tagging mod-created notifications" -- so
 # players can tell at a glance, in Message Settings, which rows are new
 # content this mod added vs. a vanilla notification we only re-tuned or
 # split into its own group.
 #
 # CORRECTED 2026-09-06: this was originally "[Smart Notifications]" with
 # square brackets -- broke the entire string. Confirmed via a real
 # error.log entry: literal `[...]` in ANY loc string is ALWAYS parsed as a
 # dynamic-text function call in this engine, with no escape for a literal
 # bracket, so `[Smart Notifications]` was read as "call function `Smart`
 # with argument `Notifications`" and failed outright, leaving the whole
 # row blank in Message Settings (confirmed by the user's screenshot).
 # Parentheses have no special meaning and are safe.
 #
 # REVISED 2026-09-08 per the user: moved from a trailing
 # " (Smart Notifications)" suffix to a short "(SN) " prefix on every
 # label. Two real problems with the old suffix, both raised by the user
 # after actually using the settings screen: (1) the fixed-width label
 # column truncates hard, and the suffix -- the one thing marking a row as
 # ours -- was exactly the part getting cut off; (2) it made every label
 # needlessly long. A short prefix fixes both: it's the first thing
 # visible even when truncated, and it's 5 characters instead of 22.
 # Applies to every group label below and the alert labels further down.
 smart_notifications_truce_expired_group:0 "(SN) Truce Expired"
 notification_smart_notifications_truce_expired_tooltip:0 "#header $notification_smart_notifications_truce_expired_name$#!\n$TOOLTIP_DELIMITER$\n$notification_smart_notifications_truce_expired_desc$"
 # CORRECTED 2026-09-06: `.GetName` is not a valid function here -- confirmed
 # via a real error.log entry ("Could not find data system function
 # 'GetName' in 'THIS.GetName'"). Every vanilla debug_log/loc example uses
 # `.GetNameNoFormatting` instead, never plain `.GetName` -- this is
 # presumably why the toast never visibly fired for the user, since the
 # notification's own name/desc text would have failed to render the same
 # way. Use `.GetNameNoFormatting` for a country name in dynamic text from
 # now on, full stop.
 notification_smart_notifications_truce_expired_name:0 "Truce with [SCOPE.sC('smart_notifications_truce_partner').GetNameNoFormatting] has expired"
 notification_smart_notifications_truce_expired_desc:0 "Our truce with [SCOPE.sC('smart_notifications_truce_partner').GetNameNoFormatting] has run out. We are no longer protected from a new [concept_diplomatic_play] or [concept_war] against them, nor they from us."

