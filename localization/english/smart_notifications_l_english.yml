 # Amendment-repealable alert (see 01_smart_notifications_alerts.txt).
 #
 # CORRECTED 2026-09-06: an alert has TWO separate name-shaped loc keys, not
 # one -- confirmed from vanilla's own naval_hostilities_alert as a working
 # example (alerts_l_english.yml). `alert_<key>_name` is the ribbon
 # tooltip title; the Message-Settings-list row label is a DIFFERENT key,
 # `<key>_setting_name` (no `alert_` prefix), bound via
 # `[AlertSettingsItem.GetSettingName]` in message_settings.gui -- NOT the
 # same getter (`NotificationSettingsItem.GetName`) messages use. Omitting
 # it renders the raw script key in Message Settings instead of a label
 # (confirmed by the user's screenshot). Both now tagged per the
 # notification-tagging convention, since both are settings-adjacent labels
 # rather than the sentence-shaped tooltip desc. Also corrected from
 # square brackets to parentheses -- see the truce entry above for why.
 # CORRECTED 2026-09-08 per the user's screenshots: every alert below was
 # missing its `_hint` loc key (vanilla's own alert tooltip template always
 # tries to render one, and shows the RAW key name instead of hiding it
 # when missing -- confirmed live for both the taxation deficit and
 # agitator alerts). Country-scoped alerts were also missing `_action`
 # (the "Click to open..." line's own text; the taxation deficit alert
 # already had one since it's state-scoped, but that convention needed
 # applying everywhere, not just there). Confirmed against vanilla's own
 # `alert_low_market_access_alert`/`alert_insufficient_tax_capacity_alert`
 # (localization/english/alerts_l_english.yml), both of which define
 # `_name`/`_hint`/`_action` (and `_desc` is genuinely optional -- vanilla's
 # low_market_access one skips it).
 alert_smart_notifications_amendment_repealable_alert_name:0 "(SN) Amendment Repeal Available"
 alert_smart_notifications_amendment_repealable_alert_desc:0 "At least one amendment on one of our active laws can now be repealed without contesting a new enactment vote."
 alert_smart_notifications_amendment_repealable_alert_hint:0 "Open the Politics screen's Laws tab, find the active law with the repealable amendment, and repeal it without needing to win a full re-enactment vote."
 alert_smart_notifications_amendment_repealable_alert_action:0 "Open Politics"
 smart_notifications_amendment_repealable_alert_setting_name:0 "(SN) Amendment Repeal Available"

