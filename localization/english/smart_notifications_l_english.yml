 # Taxation deficit alert (see common/alert_types/01_smart_notifications_alerts.txt
 # and TODO.md's sized backlog). `SCOPE.GetRootScope.GetState.GetName` and
 # the `_action`/`_hint` keys all copied from vanilla's own
 # `player_state`-scoped alerts (alert_insufficient_tax_capacity_alert/
 # alert_low_market_access_alert, localization/english/alerts_l_english.yml)
 # rather than guessing the dynamic-text chain ourselves.
 alert_smart_notifications_taxation_deficit_alert_name:0 "(SN) [SCOPE.GetRootScope.GetState.GetName] has a Taxation Deficit"
 alert_smart_notifications_taxation_deficit_alert_desc:0 "[SCOPE.GetRootScope.GetState.GetName] has insufficient Taxation Capacity for its population, reducing the efficiency of all forms of taxation there."
 alert_smart_notifications_taxation_deficit_alert_hint:0 "Build [GetBuildingType('building_government_administration').GetName] in [SCOPE.GetRootScope.GetState.GetName] to raise its [concept_tax_capacity], or look at your laws and technology to modernize your bureaucratic apparatus nationwide."
 alert_smart_notifications_taxation_deficit_alert_action:0 "State Panel for [SCOPE.GetRootScope.GetState.GetName]"
 smart_notifications_taxation_deficit_alert_setting_name:0 "(SN) Taxation Deficit"

 # Alert GROUP loc for the taxation deficit alert -- SEPARATE from the
 # alert's own _name/_desc/_hint above, and MISSING until 2026-09-08 (found
 # via the user's screenshot: with 2+ states simultaneously in deficit, the
 # alert list showed each as its own flat row instead of collapsing into
 # one "X states" bucket the way vanilla's own grouped important_actions do
 # -- e.g. "Low Standard of Living (6)"). Root cause: an `alert_group` on
 # the alert_type only enables grouping in the ENGINE; the collapsed
 # header/tooltip text itself needs its own separate `ag_<group>_name`/
 # `_desc`/`_tooltip` keys (confirmed via vanilla's own
 # `ag_low_sol_in_state_name`/`ag_expensive_government_goods_name`, same
 # alerts_l_english.yml) -- without them, the game apparently can't render
 # the grouped header and falls back to listing every instance
 # individually, which is also the leading explanation for the user's
 # separately-reported font-size inconsistency (that fallback path likely
 # isn't meant for standalone display). `$ALERT_GROUP_TOOLTIP_FOOTER$` is
 # vanilla's own shared macro, reused rather than redefined.
 ag_smart_notifications_taxation_deficit_states_name:0 "(SN) States with a Taxation Deficit"
 ag_smart_notifications_taxation_deficit_states_desc:0 "We have states whose Taxation Capacity is insufficient for their population, reducing the efficiency of all forms of taxation there."
 ag_smart_notifications_taxation_deficit_states_tooltip:0 "#header $ag_smart_notifications_taxation_deficit_states_name$#!\n$TOOLTIP_DELIMITER$\n$ag_smart_notifications_taxation_deficit_states_desc$\n\n$ALERT_GROUP_TOOLTIP_FOOTER$"

