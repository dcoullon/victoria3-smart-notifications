 # Amendment-repealable alert (see 01_smart_notifications_alerts.txt).
 #
 # CORRECTED 2026-09-06: an alert has TWO separate name-shaped loc keys, not
 # one -- confirmed from vanilla's own naval_hostilities_alert as a working
 # example (alerts_l_english.yml). `alert_<key>_name` is the ribbon
 # tooltip title; the Message-Settings-list row label is a DIFFERENT key,
 # `<key>_setting_name` (no `alert_` prefix), bound via
 # `[AlertSettingsItem.GetSettingName]` in message_settings.gui -- NOT the
 # same getter (`NotificationSettingsItem.GetName`) messages use. Omitting
 # it renders the raw script key in Message Settings instead of a label
 # (confirmed by the user's screenshot). Both now tagged per the
 # notification-tagging convention, since both are settings-adjacent labels
 # rather than the sentence-shaped tooltip desc. Also corrected from
 # square brackets to parentheses -- see the truce entry above for why.
 alert_smart_notifications_amendment_repealable_alert_name:0 "(SN) Amendment Repeal Available"
 alert_smart_notifications_amendment_repealable_alert_desc:0 "At least one amendment on one of our active laws can now be repealed without contesting a new enactment vote."
 smart_notifications_amendment_repealable_alert_setting_name:0 "(SN) Amendment Repeal Available"

 # Agitator invite alert (see common/alert_types/01_smart_notifications_alerts.txt
 # and TODO.md's sized backlog). Same two-key shape as the amendment alert
 # above -- ribbon tooltip name/desc plus the separate _setting_name Message
 # Settings row label.
 alert_smart_notifications_agitator_invite_available_alert_name:0 "(SN) Agitator Invite Available"
 alert_smart_notifications_agitator_invite_available_alert_desc:0 "We have an open agitator slot and at least one exiled agitator eligible to invite."
 smart_notifications_agitator_invite_available_alert_setting_name:0 "(SN) Agitator Invite Available"

 # Taxation deficit alert (see common/alert_types/01_smart_notifications_alerts.txt
 # and TODO.md's sized backlog). `SCOPE.GetRootScope.GetState.GetName` and the
 # extra `_action` key (shown as the grouped important-action's row label,
 # since this alert uses alert_group) both copied from vanilla's own
 # `player_state`-scoped alerts (alert_insufficient_tax_capacity_alert/
 # alert_low_market_access_alert, localization/english/alerts_l_english.yml)
 # rather than guessing the dynamic-text chain ourselves.
 alert_smart_notifications_taxation_deficit_alert_name:0 "(SN) [SCOPE.GetRootScope.GetState.GetName] has a Taxation Deficit"
 alert_smart_notifications_taxation_deficit_alert_desc:0 "[SCOPE.GetRootScope.GetState.GetName] has insufficient Taxation Capacity for its population, reducing the efficiency of all forms of taxation there."
 alert_smart_notifications_taxation_deficit_alert_action:0 "State Panel for [SCOPE.GetRootScope.GetState.GetName]"
 smart_notifications_taxation_deficit_alert_setting_name:0 "(SN) Taxation Deficit"

