 smart_notifications_taxation_deficit_alert_setting_name:0 "(SN) Taxation Deficit"

 # Alert GROUP loc for the taxation deficit alert -- SEPARATE from the
 # alert's own _name/_desc/_hint above, and MISSING until 2026-09-08 (found
 # via the user's screenshot: with 2+ states simultaneously in deficit, the
 # alert list showed each as its own flat row instead of collapsing into
 # one "X states" bucket the way vanilla's own grouped important_actions do
 # -- e.g. "Low Standard of Living (6)"). Root cause: an `alert_group` on
 # the alert_type only enables grouping in the ENGINE; the collapsed
 # header/tooltip text itself needs its own separate `ag_<group>_name`/
 # `_desc`/`_tooltip` keys (confirmed via vanilla's own
 # `ag_low_sol_in_state_name`/`ag_expensive_government_goods_name`, same
 # alerts_l_english.yml) -- without them, the game apparently can't render
 # the grouped header and falls back to listing every instance
 # individually, which is also the leading explanation for the user's
 # separately-reported font-size inconsistency (that fallback path likely
 # isn't meant for standalone display). `$ALERT_GROUP_TOOLTIP_FOOTER$` is
 # vanilla's own shared macro, reused rather than redefined.
 ag_smart_notifications_taxation_deficit_states_name:0 "(SN) States with a Taxation Deficit"
 ag_smart_notifications_taxation_deficit_states_desc:0 "We have states whose Taxation Capacity is insufficient for their population, reducing the efficiency of all forms of taxation there."
 ag_smart_notifications_taxation_deficit_states_tooltip:0 "#header $ag_smart_notifications_taxation_deficit_states_name$#!\n$TOOLTIP_DELIMITER$\n$ag_smart_notifications_taxation_deficit_states_desc$\n\n$ALERT_GROUP_TOOLTIP_FOOTER$"

 # Law commitment alert (see common/alert_types/01_smart_notifications_alerts.txt,
 # common/scripted_guis/smart_notifications_law_notify_sgui.txt, and
 # gui/politics_panel_change_law.gui). Kept the alert text static/generic
 # (no dynamic law-name reference) since clicking it opens straight to the
 # Laws tab where the specific law is visible anyway -- same lower-risk
 # call the amendment-repeal alert above already made, for the same reason.
 # REVISED 2026-09-08: wording updated to match the flag now meaning "a
 # specific law you flagged," not "whatever you're currently enacting."
 alert_smart_notifications_law_commitment_alert_name:0 "(SN) Law Ready to Enact"
 # REVISED 2026-09-08 per the user: name the specific law(s) and group(s)
 # instead of generic text, since clicking the alert can't deep-link to
 # the exact law (see the alert_type's own header comment for why -- the
 # real function for that, InformationPanelBar.OpenChangeLaw, is GUI-only
 # and can't be parameterized from a scripted alert). Built via
 # common/alert_types/01_smart_notifications_alerts.txt's
 # smart_notifications_law_commitment_list_sgui, using the real, documented
 # "build a list via a scripted GUI's custom_tooltip calls, then render it
 # live with ExecuteTooltip" technique from
 # common/scripted_guis/scripted_guis.md -- evaluated fresh every time the
 # tooltip renders, no staleness.
 #
 # CORRECTED 2026-09-08, confirmed live via error.log: the first version
 # used `SCOPE.GetRootScope.MakeScope` directly, which failed outright
 # ("Failed to convert statement for argument '0' for call
 # 'ExecuteTooltip'" -- the whole GuiScope argument never even
 # constructed, not a soft/blank failure). `SCOPE.GetRootScope` is a
 # generic wrapper that always needs an explicit per-type cast chained
 # onto it before anything else works -- exactly the same lesson already
 # learned once this project for `THIS` vs `SCOPE.sC(...)` (see
 # docs/engine-notes.md), just re-hit here for a different accessor.
 # Confirmed via an exhaustive check of every vanilla
 # `SCOPE.GetRootScope.` usage in localization/english/: every single one
 # chains `.GetCountry` immediately afterward, with zero exceptions, even
 # from contexts (journal entries) where root is already conceptually a
 # country. Fixed by adding the missing `.GetCountry` cast.
 alert_smart_notifications_law_commitment_alert_desc:0 "Ready to enact:\n[GetScriptedGui('smart_notifications_law_commitment_list_sgui').ExecuteTooltip(GuiScope.SetRoot(SCOPE.GetRootScope.GetCountry.MakeScope).End)]"
 alert_smart_notifications_law_commitment_alert_hint:0 "Open the Politics screen's Laws tab, find the listed law group, and start enacting the flagged law while the odds are in your favor."
 alert_smart_notifications_law_commitment_alert_action:0 "Politics Panel"
 smart_notifications_law_commitment_alert_setting_name:0 "(SN) Law Ready to Enact"

