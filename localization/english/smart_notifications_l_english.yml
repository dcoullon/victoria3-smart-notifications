 # Generic diplomatic action filtering (see TODO.md and
 # 06_smart_notifications_diplomatic_action_filtering.txt).
 #
 # CORRECTED 2026-09-08: originally shipped with NO name/desc/tooltip loc
 # at all, betting that `type = diplomatic_action` alone would trigger the
 # same native per-action-type text resolution vanilla's own
 # diplomatic_action_notification gets (Increase Relations, Decrease
 # Relations, autonomy requests, ... each with their own wording). Wrong
 # -- confirmed by the user's screenshot showing the raw loc key name on
 # screen instead of real text. Tried `[ROOT.GetName]` next, also wrong
 # (a real error.log entry, `root` isn't a valid dynamic-text keyword --
 # see CLAUDE.md). Shipped fully generic text as a fallback.
 #
 # CORRECTED AGAIN 2026-09-09: the fully-generic fallback above was an
 # unnecessary loss of detail, not a real limitation. Vanilla's own
 # `notification_diplomatic_action_notification_name` resolves via
 # `[SCOPE.GetRootScope.GetDiplomaticAction.GetActionNotificationName]`
 # -- a scope-bound function on the diplomatic action object itself, not
 # something tied to the specific vanilla message key the way the earlier
 # investigation assumed. Our own messages here share the exact same
 # `type = diplomatic_action` root scope (same on_diplomatic_action pulse
 # already proven to bind `SCOPE.sC('actor')`/`SCOPE.sC('recipient')`
 # correctly), so the same call works for us too -- confirmed via
 # localization/english/interfaces_l_english.yml:7575 and
 # diplomacy_l_english.yml's own per-action `_name` keys (e.g.
 # `increase_relations_action_notification_name`), which is the mechanism
 # `[ROOT.GetName]` was a wrong guess at reaching. Used only for the
 # `_name`/title, not `_desc`: checked every `_action_notification_desc`
 # in diplomacy_l_english.yml and they hardcode `GetPlayer` ("our mutual
 # relations"), correct only when the player is the actual recipient --
 # wrong if a genuinely third-party watched country's action is what
 # triggered this (player not involved at all). Our own desc text stays
 # generic-but-accurate for that reason. The `_name` fields don't have
 # this problem for the common action types (relations, rivalry, embargo,
 # alliance, ...) -- checked, none of those specific `_name` keys
 # reference GetPlayer. A few less common ones still do (e.g.
 # `guarantee_independence_action_notification_name` says "guaranteeing
 # OUR independence") -- accepted as a known minor wording inaccuracy
 # for the narrow case of a third-party watched country hit by one of
 # those specific action types, not worth blocking this fix over.


