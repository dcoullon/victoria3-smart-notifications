 alert_smart_notifications_agitator_invite_available_alert_name:0 "(SN) Agitator Invite Available"
 alert_smart_notifications_agitator_invite_available_alert_desc:0 "We have an open agitator slot and at least one exiled agitator eligible to invite."
 alert_smart_notifications_agitator_invite_available_alert_hint:0 "Open the exile pool from the Politics screen and use Invite Exile to bring an eligible agitator into an open slot."
 alert_smart_notifications_agitator_invite_available_alert_action:0 "Open Politics"
